# ── Une seule adresse, une seule application ────────────────────────────────
# Le site repond sur deux adresses : `app.rehab4perf.com`, liee depuis le site
# vitrine, et `rehab4perf.netlify.app`, l'adresse de creation. Elles servent le
# MEME code — mais pas le meme etat : session, configuration du CR, brouillons
# et cache de service worker sont propres a une ORIGINE. Deux adresses, deux
# stockages qui ne se voient pas : c'est ce qui faisait afficher a un iPad une
# configuration d'amplitudes que le Mac ignorait.
#
# L'adresse de creation renvoie donc vers l'adresse canonique, en 301 et en
# conservant chemin et parametres — le `?v=` de cache-busting compris.
#
# `force = true` est INDISPENSABLE : sans lui la regle ne s'applique que
# lorsqu'aucun fichier ne correspond, et `/index.html` existe.
#
# La regle ne vise que CET hote : les deploiements de branche
# (`dev--rehab4perf.netlify.app`) portent un autre nom de domaine et ne sont pas
# touches.
#
# A savoir : une application installee depuis l'ancienne adresse garde son
# service worker, dont le script ne peut plus se mettre a jour a travers une
# redirection. La reinstaller depuis la nouvelle adresse remet tout d'aplomb.
[[redirects]]
  from = "https://rehab4perf.netlify.app/*"
  to = "https://app.rehab4perf.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking protection
    X-Frame-Options = "SAMEORIGIN"
    # MIME-sniffing protection
    X-Content-Type-Options = "nosniff"
    # Referrer privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS (1 an, sous-domaines inclus)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Content Security Policy
    # - script-src  : app inline + SDK Supabase via jsdelivr
    # - style-src   : styles inline (app ne charge aucun CSS externe)
    # - connect-src : REST + WebSocket Supabase (wss: pour realtime SDK)
    # - img-src     : data:/blob: graphiques + thumbnails YouTube + logo/signature/tampon (Storage Supabase)
    # - frame-src   : embeds YouTube (player vidéo exercices)
    # - font-src    : polices locales uniquement
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://sxdobjodxkwexaspepdm.supabase.co wss://sxdobjodxkwexaspepdm.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: blob: https://img.youtube.com https://sxdobjodxkwexaspepdm.supabase.co; manifest-src 'self' blob:; frame-src 'self' https://www.youtube.com; font-src 'self'; object-src 'none'; base-uri 'self';"

# Le service worker ne doit jamais être mis en cache longtemps, sinon les mises à
# jour de l'app ne se propagent pas aux appareils installés.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw-pro.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Type MIME correct des manifests PWA (Netlify les sert sinon en octet-stream,
# ce qui peut bloquer le prompt d'installation sur certains navigateurs Android).
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
