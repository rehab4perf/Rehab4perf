<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rehab4Perf — Patients</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:       #F7F6F3;
  --surface:  #FFFFFF;
  --surface2: #F1F0ED;
  --border:   #E8E6E1;
  --text:     #1A1917;
  --text2:    #6B6860;
  --text3:    #9D9B96;
  --accent:   #2B5FA6;
  --accent-l: #EEF3FB;
  --accent2:  #1A3A5C;
  --orange:   #D4600A;
  --radius:   8px;
  --font-sans: 'Figtree', -apple-system, 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.pg-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 26px 16px; }
.pg-title { font-size: 1.5rem; font-weight: 700; color: var(--accent2); letter-spacing: -.01em; }
.pg-sub { font-size: .82rem; color: var(--text2); margin-top: 2px; }
.pg-wrap { max-width: 1000px; margin: 0 auto; padding: 22px 26px 60px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 26px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.kpi-v { font-size: 1.75rem; font-weight: 700; color: var(--text); line-height: 1.1; }
.kpi-l { font-size: .76rem; color: var(--text2); margin-top: 3px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.card-h { font-size: .95rem; font-weight: 700; color: var(--accent2); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-sub { font-size: .76rem; color: var(--text3); margin: 2px 0 14px; }
.badge { font-size: .68rem; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--accent-l); color: var(--accent); white-space: nowrap; }

.bar-row { display: grid; grid-template-columns: 150px minmax(0,1fr) 64px; align-items: center; gap: 12px; margin-bottom: 8px; font-size: .85rem; }
.bar-lbl { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 16px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-val { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.bar-row.muted .bar-lbl, .bar-row.muted .bar-val { color: var(--text3); }
.bar-row.muted .bar-fill { background: var(--text3); }

.split { display: flex; gap: 2px; height: 28px; border-radius: 4px; overflow: hidden; }
.split-legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; font-size: .85rem; color: var(--text2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: baseline; }

/* Sous-navigation de l'onglet */
.subnav { display: flex; gap: 2px; padding: 0 26px; background: var(--surface); border-bottom: 1px solid var(--border); }
.subnav button {
  font-family: inherit; font-size: .86rem; font-weight: 600; color: var(--text3);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 10px 14px; cursor: pointer; transition: color .12s, border-color .12s;
}
.subnav button:hover { color: var(--text2); }
.subnav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Liste */
.lst-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.lst-search {
  font-family: inherit; font-size: .85rem; color: var(--text); flex: 1; min-width: 180px;
  border: 1.5px solid var(--border); border-radius: 20px; padding: 8px 14px;
  background: var(--surface); outline: none;
}
.lst-search:focus { border-color: var(--accent); }
.lst-count { font-size: .8rem; color: var(--text2); white-space: nowrap; }
.lst-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
table.lst { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.lst th {
  background: var(--surface2); color: var(--text2); font-size: .7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; text-align: left;
  padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  cursor: pointer; user-select: none;
}
table.lst th:hover { color: var(--text); }
table.lst th .arrow { color: var(--accent); font-size: .68rem; }
table.lst td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.lst tr:last-child td { border-bottom: none; }
table.lst tbody tr { cursor: pointer; }
table.lst tbody tr:hover td { background: var(--accent-l); }
table.lst tbody tr.current td { background: var(--accent-l); box-shadow: inset 3px 0 0 var(--accent); }
.lst-nom { font-weight: 600; color: var(--text); }
.lst-dim { color: var(--text3); }
.pill { font-size: .68rem; font-weight: 600; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
.pill.actif   { background: #E8F5EE; color: #2D6A4F; }
.pill.recent  { background: #FEF3EB; color: var(--orange); }
.pill.dormant { background: var(--surface2); color: var(--text3); }

/* Fiche athlète */
.fi-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.fi-nom { font-size: 1.15rem; font-weight: 700; color: var(--accent2); }
.fi-meta { font-size: .8rem; color: var(--text2); }
.fi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px 16px; }
.fi-f { display: flex; flex-direction: column; gap: 4px; }
.fi-f.wide { grid-column: 1 / -1; }
.fi-f label { font-size: .74rem; font-weight: 600; color: var(--text2); }
.fi-f input, .fi-f select, .fi-f textarea {
  font-family: inherit; font-size: .87rem; color: var(--text);
  border: 1.5px solid var(--border); border-radius: 6px; padding: 7px 10px;
  background: var(--surface); outline: none; width: 100%;
}
.fi-f textarea { min-height: 62px; resize: vertical; line-height: 1.5; }
.fi-f input:focus, .fi-f select:focus, .fi-f textarea:focus { border-color: var(--accent); }
/* Valeur héritée du bilan : affichée en indice dans le champ, jamais écrite.
   Même vocabulaire visuel que les indices du bilan (bordure pointillée). */
.fi-f input.inherited, .fi-f textarea.inherited { border-style: dashed; background: var(--surface2); }
.fi-f input.inherited::placeholder, .fi-f textarea.inherited::placeholder { color: var(--text3); font-style: italic; }
.fi-hint { font-size: .7rem; color: var(--text3); }
.fi-bar {
  position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 16px; margin-top: 18px;
}
.fi-save {
  font-family: inherit; font-size: .85rem; font-weight: 600; color: #fff;
  background: var(--accent); border: none; border-radius: 7px; padding: 9px 20px; cursor: pointer;
}
.fi-save:hover { background: var(--accent2); }
.fi-save:disabled { opacity: .55; cursor: default; }
.fi-status { font-size: .8rem; color: var(--text2); }
.fi-status.ok { color: #2D6A4F; }
.fi-status.err { color: var(--orange); }
.atc-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.atc-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border-radius: 6px; padding: 6px 10px; font-size: .84rem;
}
.atc-chip .t { flex: 1; color: var(--text); }
.atc-chip .d { font-size: .74rem; color: var(--text2); white-space: nowrap; }
.atc-chip button { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }
.atc-chip button:hover { color: var(--orange); }
.atc-add { display: flex; gap: 7px; flex-wrap: wrap; }
.atc-add input[type=text] { flex: 1; min-width: 160px; }
.atc-add button {
  font-family: inherit; font-size: .82rem; font-weight: 600; color: var(--accent);
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 6px;
  padding: 7px 14px; cursor: pointer; white-space: nowrap;
}
.atc-add button:hover { border-color: var(--accent); }

/* Jours de disponibilité : bascule par jour, état porté par aria-pressed
   pour que l'information ne repose pas sur la seule couleur. */
.jours { display: flex; gap: 6px; flex-wrap: wrap; }
.jour {
  font-family: inherit; font-size: .82rem; font-weight: 600;
  min-width: 46px; padding: 8px 4px; cursor: pointer;
  border: 1.5px solid var(--border); border-radius: 7px;
  background: var(--surface); color: var(--text3); transition: all .12s;
}
.jour:hover { border-color: var(--text3); color: var(--text2); }
.jour[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.jours-count { font-size: .7rem; color: var(--text3); margin-top: 5px; }

/* Filtres de période : une seule rangée, au-dessus des indicateurs */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
.fchip {
  font-family: inherit; font-size: .82rem; font-weight: 500;
  padding: 7px 14px; border-radius: 20px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text2);
  transition: border-color .12s, color .12s, background .12s;
}
.fchip:hover { border-color: var(--text3); color: var(--text); }
.fchip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.fdates { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.fdates input[type=date] {
  font-family: inherit; font-size: .8rem; color: var(--text);
  border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 8px;
  background: var(--surface); outline: none;
}
.fdates input[type=date]:focus { border-color: var(--accent); }
.fdates span { font-size: .8rem; color: var(--text3); }
.fscope { font-size: .78rem; color: var(--text2); margin: -8px 0 18px; }
.fscope strong { color: var(--text); font-weight: 600; }
.fwarn { color: var(--orange); }

.note { margin-top: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 6px; font-size: .78rem; color: var(--text2); line-height: 1.55; }
.state { padding: 40px 26px; text-align: center; color: var(--text2); font-size: .9rem; }
.state.err { color: var(--orange); }
@media (max-width: 620px) {
  .pg-wrap { padding: 16px 14px 50px; }
  .pg-header { padding: 14px 16px 12px; }
  .bar-row { grid-template-columns: 110px minmax(0,1fr) 54px; gap: 8px; font-size: .8rem; }
}

/* ── Socle commun ──────────────────────────────────────────────────────
   Trois règles qui valent pour toute l'application, posées en fin de
   feuille pour passer devant les déclarations locales.

   1. Chiffres à chasse fixe. Sans ça, une valeur qui change fait sauter
      toute la colonne : « 11 » n'a pas la largeur de « 18 ».
   2. Anneau de focus clavier. Il y a des dizaines d'`outline:none` dans
      ce fichier, tous plus spécifiques que cette règle — le !important
      est ici le seul moyen d'assurer une base commune sans reprendre
      chaque déclaration une à une. `:focus-visible` ne se déclenche pas
      au clic souris, l'anneau n'apparaît donc qu'au clavier.
   3. Mouvement réduit, pour qui l'a demandé au niveau du système.
   ────────────────────────────────────────────────────────────────────── */
input[type="number"], table, time,
.tabnum { font-variant-numeric:tabular-nums; }

:focus-visible {
  outline:2px solid var(--accent2,#4A90D9) !important;
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<div class="pg-header">
  <div class="pg-title">Patients</div>
  <div class="pg-sub" id="pg-sub">Vue d'ensemble du cabinet</div>
</div>

<div class="subnav" id="pv-subnav" style="display:none">
  <button id="nav-overview" onclick="setView('overview')">Vue d'ensemble</button>
  <button id="nav-list"     onclick="setView('list')">Liste</button>
  <button id="nav-fiche"    onclick="setView('fiche')">Fiche</button>
</div>

<div id="pv-root">
  <div class="state" id="pv-state">Chargement…</div>
</div>

<script src="js/patients-data.js?v=20260803a"></script>
<script>
var SUPA_URL = 'https://sxdobjodxkwexaspepdm.supabase.co';
var SUPA_KEY = 'sb_publishable_zEJrmQOnKyRm-Y_NyojaTA_ERrDx4pl';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Barres : longueur relative au maximum de la série (pas au total) — c'est une
   comparaison de magnitude, pas une part-à-tout. Valeur toujours écrite en clair
   à droite, pour que l'identité ne repose jamais sur la seule couleur. */
function barRows(items, opts){
  opts = opts || {};
  if (!items.length) return '';
  var max = Math.max.apply(null, items.map(function(i){ return i.n; })) || 1;
  return items.map(function(i){
    var pct = Math.round(i.n / max * 100);
    var val = opts.asPct && opts.denom
      ? Math.round(i.n / opts.denom * 100) + ' %'
      : String(i.n);
    var title = opts.asPct && opts.denom
      ? i.label + ' : ' + i.n + ' patients sur ' + opts.denom
      : i.label + ' : ' + i.n + ' patients';
    return '<div class="bar-row' + (i.muted ? ' muted' : '') + '" title="' + esc(title) + '">'
      + '<span class="bar-lbl">' + esc(i.label) + '</span>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
      + '<span class="bar-val">' + val + '</span></div>';
  }).join('');
}

function card(title, sub, body, badge){
  if (!body) return '';
  return '<div class="card"><div class="card-h"><span>' + esc(title) + '</span>'
    + (badge ? '<span class="badge">' + esc(badge) + '</span>' : '')
    + '</div><div class="card-sub">' + esc(sub) + '</div>' + body + '</div>';
}

/* Rangée de filtres + rappel du périmètre courant. */
function filterBar(){
  var opts = [['3m', '3 mois'], ['6m', '6 mois'], ['12m', '1 an'], ['all', 'Tout'], ['custom', 'Personnalisé']];
  var h = '<div class="filters">';
  opts.forEach(function(o){
    h += '<button class="fchip' + (_period === o[0] ? ' active' : '') + '" onclick="setPeriod(\'' + o[0] + '\')">' + o[1] + '</button>';
  });
  if (_period === 'custom') {
    h += '<div class="fdates"><span>du</span>'
      + '<input type="date" id="f-from" value="' + esc(_customFrom) + '" onchange="setCustom()">'
      + '<span>au</span>'
      + '<input type="date" id="f-to" value="' + esc(_customTo) + '" onchange="setCustom()">'
      + '</div>';
  }
  h += '</div>';
  return h;
}

function scopeLine(s, bounds){
  // L'invalidité se teste EN PREMIER : une plage inversée est ramenée à des
  // bornes nulles, elle serait donc confondue avec « pas de filtre » et
  // l'utilisateur verrait tout son fichier sans savoir que sa saisie a été rejetée.
  if (bounds.invalid) {
    return '<div class="fscope fwarn">La date de début est postérieure à la date de fin — plage ignorée, toutes les données sont affichées.</div>';
  }
  if (!bounds.from && !bounds.to) {
    return '<div class="fscope">Toutes les données, depuis le premier patient enregistré.</div>';
  }
  var fmt = function(d){ if (!d) return '…'; var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  return '<div class="fscope">Période du <strong>' + fmt(bounds.from) + '</strong> au <strong>' + fmt(bounds.to) + '</strong>'
    + ' — un patient est compté s\'il a eu une séance, un bilan ou a été créé sur cette période.</div>';
}

function fmtDate(d){
  if (!d) return '';
  var p = String(d).slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}

/* ── Vue Liste ─────────────────────────────────────────────────────
   Cliquer une ligne sélectionne le patient globalement : on délègue au
   topnav via postMessage plutôt que de tenir un état local, pour éviter
   deux sources de vérité concurrentes. */
function renderList(rows, bounds){
  var q = r4pNorm(_search);
  var filtered = q
    ? rows.filter(function(r){
        return r4pNorm(r.nom + ' ' + r.prenom + ' ' + r.sport).indexOf(q) !== -1;
      })
    : rows;
  var sorted = r4pSortRoster(filtered, _sortKey, _sortAsc);

  var cols = [
    ['nom',              'Nom'],
    ['prenom',           'Prénom'],
    ['age',              'Âge'],
    ['sexe',             'Sexe'],
    ['sport',            'Sport'],
    ['derniereActivite', 'Dernière activité'],
    ['nbBilans',         'Bilans'],
    ['statut',           'Statut'],
  ];

  var h = '<div class="pg-wrap">';
  h += filterBar();
  h += scopeLine(null, bounds);
  h += '<div class="lst-tools">'
    + '<input type="text" class="lst-search" id="lst-q" placeholder="Rechercher un nom, un prénom, un sport…" value="' + esc(_search) + '" oninput="onSearch(this.value)">'
    + '<span class="lst-count">' + sorted.length + ' patient' + (sorted.length > 1 ? 's' : '') + '</span>'
    + '</div>';

  if (!sorted.length) {
    h += '<div class="state">' + (q ? 'Aucun patient ne correspond à cette recherche.' : 'Aucun patient sur cette période.') + '</div></div>';
    document.getElementById('pv-root').innerHTML = h;
    return;
  }

  h += '<div class="lst-wrap"><table class="lst"><thead><tr>';
  cols.forEach(function(c){
    var arrow = _sortKey === c[0] ? ' <span class="arrow">' + (_sortAsc ? '▲' : '▼') + '</span>' : '';
    h += '<th onclick="setSort(\'' + c[0] + '\')">' + c[1] + arrow + '</th>';
  });
  h += '</tr></thead><tbody>';
  sorted.forEach(function(r){
    var cur = _currentPatientId && String(_currentPatientId) === String(r.id);
    h += '<tr class="' + (cur ? 'current' : '') + '" onclick="pickPatient(\'' + esc(r.id) + '\')"'
      + ' title="Sélectionner ' + esc(r.prenom + ' ' + r.nom) + '">'
      + '<td class="lst-nom">' + esc(r.nom) + '</td>'
      + '<td>' + esc(r.prenom) + '</td>'
      + '<td>' + (r.age === null ? '<span class="lst-dim">—</span>' : r.age + ' ans') + '</td>'
      + '<td>' + (r.sexe ? esc(r.sexe === 'F' ? 'F' : 'H') : '<span class="lst-dim">—</span>') + '</td>'
      + '<td>' + (r.sport ? esc(r.sport) : '<span class="lst-dim">—</span>') + '</td>'
      + '<td>' + (r.derniereActivite ? fmtDate(r.derniereActivite) : '<span class="lst-dim">jamais</span>') + '</td>'
      + '<td>' + (r.nbBilans || '<span class="lst-dim">0</span>') + '</td>'
      + '<td><span class="pill ' + r.statut + '">' + R4P_STATUT_LABELS[r.statut] + '</span></td>'
      + '</tr>';
  });
  h += '</tbody></table></div></div>';
  document.getElementById('pv-root').innerHTML = h;
}

/* ── Vue Fiche ─────────────────────────────────────────────────────
   Les champs qui existent aussi dans le bilan (poids, taille, activité,
   médecin) affichent la valeur du bilan le plus récent en indice quand la
   fiche est vide. L'indice n'est jamais enregistré : seule une saisie
   explicite du praticien devient une valeur de fiche. */
function ficheField(p, key, bilanKey, label, opts){
  opts = opts || {};
  var r = bilanKey ? r4pResolveFicheField(p, _raw.bilans, key, bilanKey) : { value: p[key] || '', source: p[key] ? 'fiche' : '' };
  var own = (r.source === 'fiche') ? r.value : '';
  var ghost = (r.source === 'bilan') ? String(r.value) : '';
  var cls = ghost ? ' class="inherited"' : '';
  var ph = ghost ? (ghost + (opts.unit || '') + (r.date ? ' — bilan du ' + fmtDate(r.date) : '')) : (opts.placeholder || '');
  var h = '<div class="fi-f' + (opts.wide ? ' wide' : '') + '"><label for="fi-' + key + '">' + esc(label) + '</label>';
  if (opts.list) {
    h += '<select id="fi-' + key + '"><option value="">—</option>'
       + opts.list.map(function(o){
           return '<option value="' + o[0] + '"' + (String(own) === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
         }).join('')
       + '</select>';
  } else if (opts.textarea) {
    h += '<textarea id="fi-' + key + '"' + cls + ' placeholder="' + esc(ph) + '">' + esc(own) + '</textarea>';
  } else {
    h += '<input type="' + (opts.number ? 'number' : 'text') + '" id="fi-' + key + '"' + cls
       + (opts.step ? ' step="' + opts.step + '"' : '') + (opts.min ? ' min="' + opts.min + '"' : '') + (opts.max ? ' max="' + opts.max + '"' : '')
       + ' value="' + esc(own) + '" placeholder="' + esc(ph) + '">';
  }
  if (ghost) h += '<span class="fi-hint">Valeur du bilan le plus récent — saisir ici pour la remplacer.</span>';
  h += '</div>';
  return h;
}

function renderFiche(){
  var root = document.getElementById('pv-root');
  if (!_currentPatientId) {
    root.innerHTML = '<div class="pg-wrap"><div class="state">Aucun patient sélectionné.<br>'
      + 'Choisissez-en un dans la <a href="#" onclick="setView(\'list\');return false;" style="color:var(--accent)">liste</a> ou depuis le sélecteur en haut de page.</div></div>';
    return;
  }
  var p = (_raw.patients || []).find(function(x){ return String(x.id) === String(_currentPatientId); });
  if (!p) {
    root.innerHTML = '<div class="pg-wrap"><div class="state">Ce patient n\'est pas dans la liste chargée.</div></div>';
    return;
  }
  var f = p.fiche || {};
  var age = r4pAge(p.ddn);

  var h = '<div class="pg-wrap">';
  h += '<div class="fi-head"><span class="fi-nom">' + esc((p.prenom || '') + ' ' + (p.nom || '')) + '</span>'
     + '<span class="fi-meta">' + (age !== null ? age + ' ans · ' : '')
     + (p.sexe === 'F' ? 'Femme' : p.sexe === 'H' ? 'Homme' : '—')
     + (p.sport ? ' · ' + esc(p.sport) : '') + '</span></div>';

  h += '<div class="card"><div class="card-h"><span>Anthropométrie</span></div><div class="card-sub">Le bilan garde sa propre valeur datée — la fiche ne l\'écrase jamais</div><div class="fi-grid">'
     + ficheField(p, 'poids',  'poids',  'Poids (kg)',  { number: true, step: '0.1', unit: ' kg' })
     + ficheField(p, 'taille', 'taille', 'Taille (cm)', { number: true, step: '1',   unit: ' cm' })
     + '</div></div>';

  h += '<div class="card"><div class="card-h"><span>Profil</span></div><div class="card-sub">Listes fermées, pour rester exploitables en statistiques</div><div class="fi-grid">'
     + ficheField(p, 'niveau',          null, 'Niveau de pratique', { list: R4P_NIVEAUX })
     + ficheField(p, 'lateralite_main', null, 'Main dominante',     { list: R4P_LAT_MAIN })
     + ficheField(p, 'lateralite_pied', null, 'Pied dominant',      { list: R4P_LAT_PIED })
     + '</div></div>';

  h += '<div class="card"><div class="card-h"><span>Contexte</span></div><div class="card-sub"></div><div class="fi-grid">'
     + ficheField(p, 'activite', 'activite', 'Activité professionnelle', { placeholder: 'Infirmier, bureau sédentaire…' })
     + ficheField(p, 'medecin',  'medecin',  'Médecin prescripteur',     { placeholder: 'Dr …' })
     + '</div></div>';

  h += '<div class="card"><div class="card-h"><span>Cadre d\'entraînement</span></div><div class="card-sub">Sert à dimensionner les programmes</div><div class="fi-grid">'
     + '<div class="fi-f"><label for="fi-seances">Séances par semaine</label>'
     + '<input type="number" id="fi-seances" min="0" max="21" step="1" value="' + esc(f.seancesSemaine || '') + '" placeholder="3"></div>'
     + '<div class="fi-f wide"><label for="fi-materiel">Matériel et lieu</label>'
     + '<textarea id="fi-materiel" style="min-height:88px" placeholder="Salle de sport équipée : barre olympique, haltères 2–40 kg, rack, poulie. À domicile : élastiques et kettlebell 16 kg.">' + esc(f.materiel || '') + '</textarea></div>'
     + '<div class="fi-f wide"><label>Jours d\'entraînement possibles</label>'
     + '<div class="jours" id="fi-jours">'
     + R4P_JOURS.map(function(j){
         return '<button type="button" class="jour" data-j="' + j[0] + '" aria-pressed="false" onclick="toggleJour(\'' + j[0] + '\')">' + j[1] + '</button>';
       }).join('')
     + '</div><span class="jours-count" id="fi-jours-count"></span></div>'
     + '<div class="fi-f wide"><label for="fi-dispo">Précisions sur les disponibilités</label>'
     + '<textarea id="fi-dispo" style="min-height:62px" placeholder="Plutôt le matin avant 9 h, sauf le samedi. Indisponible pendant les vacances scolaires.">' + esc(f.disponibilites || '') + '</textarea></div>'
     + '<div class="fi-f wide"><label for="fi-ci">Contre-indications</label>'
     + '<textarea id="fi-ci" placeholder="Pas d\'impact, éviter la flexion lombaire chargée…">' + esc(f.contreIndications || '') + '</textarea></div>'
     + '</div></div>';

  /* Antécédents : liste datée, pas un bloc de texte — sinon la chronologie,
     qui est l'information utile, se perd à la première réécriture. */
  h += '<div class="card"><div class="card-h"><span>Antécédents</span></div>'
     + '<div class="card-sub">Une entrée par épisode, avec sa date si elle est connue</div>'
     + '<div class="atc-list" id="atc-list"></div>'
     + '<div class="atc-add">'
     + '<input type="text" id="atc-text" placeholder="Ex : rupture LCA genou gauche">'
     + '<input type="date" id="atc-date" style="max-width:170px">'
     + '<button type="button" onclick="addAntecedent()">Ajouter</button>'
     + '</div></div>';

  h += '<div class="fi-bar"><button class="fi-save" id="fi-save" onclick="saveFiche()">Enregistrer la fiche</button>'
     + '<span class="fi-status" id="fi-status"></span></div>';
  h += '</div>';
  root.innerHTML = h;

  _antecedents = r4pNormAntecedents(f.antecedents);
  renderAntecedents();
  _jours = Array.isArray(f.jours) ? f.jours.slice() : [];
  renderJours();
}

function renderJours(){
  var wrap = document.getElementById('fi-jours');
  if (!wrap) return;
  wrap.querySelectorAll('.jour').forEach(function(b){
    b.setAttribute('aria-pressed', _jours.indexOf(b.dataset.j) !== -1 ? 'true' : 'false');
  });
  var c = document.getElementById('fi-jours-count');
  if (c) {
    c.textContent = _jours.length
      ? _jours.length + ' jour' + (_jours.length > 1 ? 's' : '') + ' sélectionné' + (_jours.length > 1 ? 's' : '')
      : 'Aucun jour sélectionné.';
  }
}

function toggleJour(k){
  var i = _jours.indexOf(k);
  if (i === -1) _jours.push(k); else _jours.splice(i, 1);
  // Réordonner selon la semaine plutôt que selon l'ordre des clics, pour que
  // la valeur enregistrée soit stable et lisible.
  var ordre = R4P_JOURS.map(function(j){ return j[0]; });
  _jours.sort(function(a, b){ return ordre.indexOf(a) - ordre.indexOf(b); });
  renderJours();
}

function renderAntecedents(){
  var el = document.getElementById('atc-list');
  if (!el) return;
  if (!_antecedents.length) {
    el.innerHTML = '<span class="fi-hint">Aucun antécédent renseigné.</span>';
    return;
  }
  el.innerHTML = _antecedents.map(function(a, i){
    return '<div class="atc-chip"><span class="t">' + esc(a.text) + '</span>'
      + (a.date ? '<span class="d">' + fmtDate(a.date) + '</span>' : '')
      + '<button type="button" title="Retirer" onclick="removeAntecedent(' + i + ')">&times;</button></div>';
  }).join('');
}

function addAntecedent(){
  var t = document.getElementById('atc-text'), d = document.getElementById('atc-date');
  var txt = (t.value || '').trim();
  if (!txt) return;
  _antecedents.push({ text: txt, date: d.value || '' });
  t.value = ''; d.value = '';
  renderAntecedents();
  t.focus();
}

function removeAntecedent(i){
  _antecedents.splice(i, 1);
  renderAntecedents();
}

function render(s, hasBilanPlan, bounds){
  var periodActive = !!(bounds.from || bounds.to);
  var h = '<div class="pg-wrap">';
  h += filterBar();
  h += scopeLine(s, bounds);

  /* — Indicateurs —
     Actifs / dormants sont des notions « à la date du jour » sur l'ensemble du
     fichier : les afficher à côté d'une période filtrée serait trompeur, on les
     remplace alors par des compteurs propres à la période. */
  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-v">' + s.total + '</div><div class="kpi-l">'
     + (periodActive ? 'Patients sur la période' : 'Patients au total') + '</div></div>';
  if (periodActive) {
    if (s.nouveaux !== null) {
      h += '<div class="kpi"><div class="kpi-v">' + s.nouveauxPeriode + '</div><div class="kpi-l">Nouveaux sur la période</div></div>';
    }
    if (hasBilanPlan) {
      h += '<div class="kpi"><div class="kpi-v">' + s.nbBilans + '</div><div class="kpi-l">Bilans réalisés</div></div>';
    }
    h += '<div class="kpi"><div class="kpi-v">' + _totalGlobal + '</div><div class="kpi-l">Patients au total (tout)</div></div>';
  } else {
    h += '<div class="kpi"><div class="kpi-v">' + s.actifs + '</div><div class="kpi-l">Actifs — séance &lt; 30 j</div></div>';
    h += '<div class="kpi"><div class="kpi-v">' + s.dormants + '</div><div class="kpi-l">Dormants — &gt; 90 j</div></div>';
    if (s.nouveaux !== null) {
      h += '<div class="kpi"><div class="kpi-v">' + s.nouveaux + '</div><div class="kpi-l">Nouveaux ce mois</div></div>';
    }
  }
  h += '</div>';

  /* — Sexe : deux valeurs, une barre partagée suffit (un camembert de deux parts
       n'apporte rien et se lit moins vite) — */
  if (s.femmes || s.hommes) {
    var tot = s.femmes + s.hommes;
    var pf = Math.round(s.femmes / tot * 100), ph = 100 - pf;
    var body = '<div class="split">'
      + '<div style="flex:' + s.femmes + ';background:var(--accent);border-radius:4px 0 0 4px" title="Femmes : ' + s.femmes + ' (' + pf + ' %)"></div>'
      + '<div style="flex:' + s.hommes + ';background:var(--orange);border-radius:0 4px 4px 0" title="Hommes : ' + s.hommes + ' (' + ph + ' %)"></div>'
      + '</div><div class="split-legend">'
      + '<span><span class="dot" style="background:var(--accent)"></span>Femmes — ' + s.femmes + ' <span style="color:var(--text3)">(' + pf + ' %)</span></span>'
      + '<span><span class="dot" style="background:var(--orange)"></span>Hommes — ' + s.hommes + ' <span style="color:var(--text3)">(' + ph + ' %)</span></span>'
      + '</div>';
    if (s.sexeInconnu) body += '<div class="note">' + s.sexeInconnu + ' patient(s) sans sexe renseigné, exclus de cette répartition.</div>';
    h += card('Sexe', tot + ' patients renseignés', body);
  }

  /* — Âge — */
  var agesNonVides = s.ages.filter(function(a){ return a.n > 0; });
  if (agesNonVides.length) {
    var bodyAge = barRows(s.ages);
    if (s.ageInconnu) bodyAge += '<div class="note">' + s.ageInconnu + ' patient(s) sans date de naissance.</div>';
    h += card('Âge', 'Calculé depuis la date de naissance', bodyAge);
  }

  /* — Sports — */
  if (s.sports.length || s.sportAutres || s.sportVide) {
    var sportItems = s.sports.slice();
    if (s.sportAutres) sportItems.push({ label: 'Autres', n: s.sportAutres });
    if (s.sportVide)   sportItems.push({ label: 'Non renseigné', n: s.sportVide, muted: true });
    h += card('Sports pratiqués', 'Regroupés par alias — la saisie reste libre', barRows(sportItems));
  }

  if (hasBilanPlan) {
    /* — Régions : un patient peut avoir plusieurs zones, donc les parts ne
         partagent pas un tout — des barres, jamais un camembert — */
    if (s.regions.length) {
      h += card('Régions atteintes',
        'Part des ' + s.patientsAvecBilan + ' patients ayant au moins un bilan — un patient peut compter dans plusieurs lignes',
        barRows(s.regions, { asPct: true, denom: s.patientsAvecBilan }),
        'Bilan');
    }

    /* — Motifs — */
    if (s.motifs.length || s.motifNonReconnu) {
      var motifItems = s.motifs.slice();
      if (s.motifNonReconnu) motifItems.push({ label: 'Non reconnu', n: s.motifNonReconnu, muted: true });
      var reconnus = s.motifsRenseignes - s.motifNonReconnu;
      var tauxNon = s.motifsRenseignes ? Math.round(s.motifNonReconnu / s.motifsRenseignes * 100) : 0;
      var bodyMotif = barRows(motifItems, { asPct: true, denom: s.motifsRenseignes })
        + '<div class="note">' + s.motifsRenseignes + ' motif(s) renseigné(s) · ' + reconnus + ' reconnu(s), '
        + s.motifNonReconnu + ' non reconnu(s) — ' + tauxNon + ' %.'
        + ' <span style="color:var(--text3)">Au-delà de 30 % de non-reconnus, le classement devient trompeur : c\'est le signal qu\'un champ pathologie structuré serait nécessaire.</span></div>';
      h += card('Motifs de consultation',
        'Extraits par mots-clés du champ « Motif du bilan » — un motif peut compter dans plusieurs lignes',
        bodyMotif, 'Bilan');
    }
  }

  if (!s.total) {
    h += '<div class="state">' + (periodActive
      ? 'Aucun patient sur cette période.'
      : 'Aucun patient enregistré. Ajoutez-en un depuis le sélecteur en haut de page.') + '</div>';
  }

  h += '</div>';
  document.getElementById('pv-root').innerHTML = h;
}

/* Sélection ciblée dans le JSON : on ne rapatrie que les deux clés utiles au lieu
   du « donnees » complet (plusieurs dizaines de Ko par bilan). Repli sur le JSON
   entier si la projection est refusée, pour ne pas perdre la fonctionnalité. */
function fetchBilans(uid){
  return sb.from('bilans')
    .select('patient_id,date,zones:donnees->>f-pain-zones,motif:donnees->>f-motif,sport:donnees->>f-sport')
    .eq('praticien_id', uid)
    .then(function(res){
      if (!res.error) return res.data || [];
      return sb.from('bilans').select('patient_id,date,donnees').eq('praticien_id', uid)
        .then(function(r2){
          if (r2.error) throw r2.error;
          return (r2.data || []).map(function(b){
            var d = b.donnees || {};
            return { patient_id: b.patient_id, date: b.date, zones: d['f-pain-zones'], motif: d['f-motif'], sport: d['f-sport'] };
          });
        });
    });
}

/* ── État du filtre ────────────────────────────────────────────────
   Les données ne sont chargées qu'une fois ; changer de période ne
   déclenche aucune requête, seulement une nouvelle agrégation locale. */
var _period = 'all', _customFrom = '', _customTo = '';
var _raw = null, _hasBilanPlan = true, _totalGlobal = 0;
var _view = 'overview', _search = '', _sortKey = 'nom', _sortAsc = true;
var _antecedents = [], _jours = [];
// Le patient courant est déjà connu du shell avant tout postMessage : on lit
// son cache pour que la fiche soit utilisable dès l'ouverture de l'onglet.
var _currentPatientId = (function(){
  try {
    var p = JSON.parse(localStorage.getItem('r4p-current-patient') || 'null');
    return p && p.id ? p.id : null;
  } catch(e){ return null; }
})();

function currentBounds(){
  if (_period === 'all') return { from: null, to: null };
  if (_period === 'custom') {
    var f = _customFrom || null, t = _customTo || null;
    if (!f && !t) return { from: null, to: null };
    if (f && t && f > t) return { from: null, to: null, invalid: true };
    return { from: f, to: t };
  }
  var mois = { '3m': 3, '6m': 6, '12m': 12 }[_period] || 0;
  return { from: r4pPeriodFrom(mois), to: null };
}

function apply(){
  if (!_raw) return;
  var b = currentBounds();
  var c = r4pFilterCohort(_raw.patients, _raw.seances, _raw.bilans, b.from, b.to);

  document.getElementById('pv-subnav').style.display = 'flex';
  document.getElementById('nav-overview').className = _view === 'overview' ? 'active' : '';
  document.getElementById('nav-list').className     = _view === 'list'     ? 'active' : '';
  document.getElementById('nav-fiche').className    = _view === 'fiche'    ? 'active' : '';
  document.getElementById('pg-sub').textContent =
    _view === 'list'  ? 'Liste des patients'
    : _view === 'fiche' ? 'Fiche athlète'
    : 'Vue d\'ensemble du cabinet';

  // La fiche porte un seul patient : le filtre de période ne s'y applique pas.
  if (_view === 'fiche') { renderFiche(); return; }

  if (_view === 'list') {
    // La liste utilise la cohorte filtrée, mais les dates d'activité et le
    // statut sont calculés sur TOUTES les séances et bilans : sinon un patient
    // vu en janvier paraîtrait « jamais actif » sous un filtre 3 mois.
    var rows = r4pBuildRoster(c.patients, _raw.seances, _raw.bilans);
    renderList(rows, b);
    return;
  }

  var s = r4pBuildStats(c.patients, c.seances, c.bilans);
  // « Nouveaux sur la période » : dépend des bornes, donc calculé ici et non
  // dans l'agrégat générique.
  s.nouveauxPeriode = (b.from || b.to)
    ? c.patients.filter(function(p){
        var d = String(p.created_at || '').slice(0, 10);
        if (!d) return false;
        if (b.from && d < b.from) return false;
        if (b.to   && d > b.to)   return false;
        return true;
      }).length
    : s.nouveaux;
  render(s, _hasBilanPlan, b);
}

function setPeriod(p){
  _period = p;
  // Par défaut, la plage personnalisée reprend les 3 derniers mois : un
  // formulaire vide n'afficherait rien et donnerait l'impression d'un bug.
  if (p === 'custom' && !_customFrom && !_customTo) {
    _customFrom = r4pPeriodFrom(3);
    _customTo   = new Date().toISOString().slice(0, 10);
  }
  apply();
}

function setCustom(){
  var f = document.getElementById('f-from'), t = document.getElementById('f-to');
  _customFrom = f ? f.value : '';
  _customTo   = t ? t.value : '';
  apply();
}

function setView(v){ _view = v; apply(); }

function setSort(k){
  if (_sortKey === k) _sortAsc = !_sortAsc;
  else { _sortKey = k; _sortAsc = true; }
  apply();
}

/* Le re-rendu recrée le champ : on lui rend le focus et le curseur pour que
   la frappe ne soit pas interrompue à chaque caractère. */
function onSearch(v){
  _search = v;
  apply();
  var el = document.getElementById('lst-q');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function pickPatient(id){
  window.parent.postMessage({ type: 'r4p-select-patient', patientId: id }, window.location.origin);
}

/* Lit un champ ; rend null si vide, pour effacer la valeur en base plutôt que
   d'y écrire une chaîne vide (un champ vide doit redonner la main à l'indice
   du bilan, pas bloquer sur '' qui compterait comme une saisie). */
function fVal(id, isNumber){
  var el = document.getElementById(id);
  if (!el) return null;
  var v = (el.value || '').trim();
  if (!v) return null;
  if (isNumber) { var n = parseFloat(v.replace(',', '.')); return isNaN(n) ? null : n; }
  return v;
}

function saveFiche(){
  var p = (_raw.patients || []).find(function(x){ return String(x.id) === String(_currentPatientId); });
  if (!p) return;
  var btn = document.getElementById('fi-save'), st = document.getElementById('fi-status');
  btn.disabled = true; st.className = 'fi-status'; st.textContent = 'Enregistrement…';

  var patch = {
    poids:            fVal('fi-poids', true),
    taille:           fVal('fi-taille', true),
    niveau:           fVal('fi-niveau'),
    lateralite_main:  fVal('fi-lateralite_main'),
    lateralite_pied:  fVal('fi-lateralite_pied'),
    activite:         fVal('fi-activite'),
    medecin:          fVal('fi-medecin'),
    fiche: {
      seancesSemaine:    fVal('fi-seances', true),
      materiel:          fVal('fi-materiel'),
      jours:             _jours,
      disponibilites:    fVal('fi-dispo'),
      contreIndications: fVal('fi-ci'),
      antecedents:       _antecedents
    }
  };

  sb.from('patients').update(patch).eq('id', p.id).select().single().then(function(res){
    btn.disabled = false;
    if (res.error) {
      st.className = 'fi-status err';
      // 42703 = colonne inexistante : la migration n'a pas encore été appliquée.
      // On le dit explicitement, sinon l'erreur brute est incompréhensible.
      st.textContent = (res.error.code === '42703' || /column .* does not exist/i.test(res.error.message || ''))
        ? 'Les colonnes de la fiche ne sont pas encore créées en base — exécutez la migration supabase/migrations/20260730_fiche_athlete.sql.'
        : 'Échec : ' + res.error.message;
      return;
    }
    // Rafraîchir la copie locale pour que les indices et la liste restent justes
    var i = _raw.patients.findIndex(function(x){ return String(x.id) === String(p.id); });
    if (i !== -1) _raw.patients[i] = res.data;
    st.className = 'fi-status ok';
    st.textContent = 'Fiche enregistrée.';
    setTimeout(function(){ if (st) st.textContent = ''; }, 3000);
  }).catch(function(err){
    btn.disabled = false;
    st.className = 'fi-status err';
    st.textContent = 'Erreur réseau : ' + ((err && err.message) || err);
  });
}

/* Le topnav diffuse la sélection courante : on s'y synchronise plutôt que de
   tenir un état parallèle, pour que la ligne surlignée soit toujours juste. */
window.addEventListener('message', function(e){
  if (e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === 'r4p-patient-selected') {
    _currentPatientId = e.data.patient ? e.data.patient.id : null;
    if (_raw) apply();
  }
});

sb.auth.getUser().then(function(r){
  var user = r.data && r.data.user;
  if (!user) { document.getElementById('pv-state').textContent = 'Session expirée — rechargez la page.'; return; }
  var uid = user.id;
  var plan = (user.user_metadata || {}).plan;
  var hasBilanPlan = plan !== 'performance';

  var jobs = [
    sb.from('patients').select('*').eq('praticien_id', uid),
    sb.from('seances_planifiees').select('patient_id,date').eq('praticien_id', uid),
    hasBilanPlan ? fetchBilans(uid) : Promise.resolve([])
  ];

  Promise.all(jobs).then(function(res){
    var pRes = res[0], sRes = res[1], bilans = res[2];
    if (pRes.error) throw pRes.error;
    // Résolution du sport à la lecture (voir r4pResolveSport) : deux endroits
    // de saisie non synchronisés aujourd'hui, patients.sport fait foi et à
    // défaut on prend le f-sport du bilan le plus récent. Aucune écriture.
    _raw = {
      patients: r4pResolveSport(pRes.data || [], bilans),
      seances:  (sRes && !sRes.error) ? (sRes.data || []) : [],
      bilans:   bilans
    };
    _hasBilanPlan = hasBilanPlan;
    _totalGlobal  = _raw.patients.length;
    apply();
  }).catch(function(err){
    var el = document.getElementById('pv-state');
    if (el) { el.className = 'state err'; el.textContent = 'Impossible de charger les données : ' + ((err && err.message) || err); }
  });
});
</script>
</body>
</html>
