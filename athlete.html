<div id="pushBanner" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9998;max-width:420px;margin:0 auto;background:#1A3A5C;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.32);font-family:'Figtree',sans-serif;">
  <div style="display:flex;align-items:flex-start;gap:12px;">
    <div style="font-size:1.4rem;line-height:1;">🔔</div>
    <div style="flex:1;">
      <div style="font-weight:700;font-size:.9rem;">Activer les rappels de séances</div>
      <div style="font-size:.78rem;opacity:.85;margin-top:2px;line-height:1.4;">Soyez prévenu dès que votre praticien modifie votre planning.</div>

    <button onclick="_enablePush()" style="background:#4A90D9;border:none;color:#fff;font-weight:700;font-size:.82rem;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;">Activer</button>
  </div>
</div>

<script>
/* Enregistrement du service worker (PWA installable). Recharge une fois quand un
   nouveau SW prend le contrôle, pour que les déploiements se propagent proprement. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: '/athlete.html' })
      .then(function () { _maybeOfferPush(); })
      .catch(function (e) { console.warn('SW:', e); });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return; reloaded = true; window.location.reload();
    });
  });
}
window.addEventListener('load', function () { _maybeOfferInstallGuide(); });

/* ── Web Push : abonnement de l'athlète (app installée) ─────────────── */
var VAPID_PUBLIC = 'BDmfkeEvhdOG1CGaVFBUn7vsFYqYia4_YUtsFK9n0fPtIIc52WADnUHhVaVIZPnvV3OicUod6aORVvJbXU4ZmMo';
function _urlB64ToUint8(base64) {
  var pad = '='.repeat((4 - base64.length % 4) % 4);
  var b64 = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(b64), arr = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function _pushSupported() {
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function _showPushBanner() { var b = document.getElementById('pushBanner'); if (b) b.style.display = 'block'; }
function _hidePushBanner() { var b = document.getElementById('pushBanner'); if (b) b.style.display = 'none'; }
function _dismissPushBanner() { _hidePushBanner(); try { localStorage.setItem('r4p-push-dismissed', String(Date.now())); } catch (e) {} }
function _enablePush() {
  if (!('Notification' in window)) { _hidePushBanner(); return; }
  Notification.requestPermission().then(function (perm) {
    if (perm === 'granted') _subscribePush();
    _hidePushBanner();
  });
}
function _subscribePush() {
  navigator.serviceWorker.ready.then(function (reg) {
    return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: _urlB64ToUint8(VAPID_PUBLIC) });
  }).then(function (sub) {
    var j = sub.toJSON();
    return fetch(SUPA_URL + '/functions/v1/save-push-subscription', {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ patient_id: _patientId, endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth })
    });
  }).then(function () { _hidePushBanner(); })
    .catch(function (e) { console.warn('push subscribe:', e); });
}
function _maybeOfferPush() {
  // Seulement l'athlète (pas la vue kiné), en mode calendrier, avec push supporté.
  // Sur iOS non installé, PushManager est absent → la bannière ne s'affiche pas.
  if (typeof _patientId === 'undefined' || !_patientId || _kineMode) return;
  if (!_pushSupported() || Notification.permission === 'denied') return;
  try {
    var d = +localStorage.getItem('r4p-push-dismissed');
    if (d && (Date.now() - d) < 7 * 864e5 && Notification.permission !== 'granted') return; // « Plus tard » récent
  } catch (e) {}
  navigator.serviceWorker.ready.then(function (reg) {
    reg.pushManager.getSubscription().then(function (sub) {
      if (sub) return;                                   // déjà abonné
      if (Notification.permission === 'granted') _subscribePush();  // silencieux
      else _showPushBanner();                            // demander via bannière
    });
  });
}

/* ── Tuto « Installer sur l'écran d'accueil » ─────────────────────────
   iOS et Android n'offrent aucun moyen d'installer une PWA depuis un lien
   partagé automatiquement (pas de prompt natif fiable, surtout sur iOS
   Safari) : on explique la manip en quelques étapes, adaptées à l'appareil
   détecté via userAgent. */
function _isStandalone() {
  return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
function _installPlatform() {
  var ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'other';
}
function _installGuideHtml() {
  var plat = _installPlatform();
  var steps;
  if (plat === 'ios') {
    steps = [
      ['Appuie sur le bouton <b>Partager</b>', 'L’icône carrée avec une flèche vers le haut, en bas de l’écran Safari (ou en haut sur iPad).'],
      ['Choisis <b>« Sur l’écran d’accueil »</b>', 'Fais défiler la liste si besoin — l’icône ressemble à un petit rectangle avec un « + ».'],
      ['Appuie sur <b>Ajouter</b>', 'Une icône Rehab4Perf apparaît sur ton écran d’accueil, comme une vraie application.'],
      ['Ouvre l’app depuis cette icône', 'C’est important : les notifications ne fonctionnent que si tu l’ouvres depuis l’icône installée, pas depuis Safari.']
    ];
  } else if (plat === 'android') {
    steps = [
      ['Appuie sur le menu <b>⋮</b> de Chrome', 'En haut à droite de l’écran.'],
      ['Choisis <b>« Installer l’application »</b>', 'Ou « Ajouter à l’écran d’accueil » selon la version. Un bandeau propose parfois directement l’installation — dans ce cas, appuie dessus.'],
      ['Confirme l’installation', 'Une icône Rehab4Perf apparaît sur ton écran d’accueil.'],
      ['Ouvre l’app depuis cette icône', 'Tu retrouveras ton calendrier comme une vraie application, en plein écran.']
    ];
  } else {
    steps = [
      ['Ouvre ce lien sur ton téléphone', 'Depuis Safari (iPhone/iPad) ou Chrome (Android).'],
      ['Utilise le menu de partage ou le menu ⋮ du navigateur', 'Cherche « Sur l’écran d’accueil » (iPhone) ou « Installer l’application » (Android).'],
      ['Ouvre l’app depuis l’icône ajoutée', 'Elle se comporte alors comme une vraie application.']
    ];
  }
  var html = '<p style="margin:0 0 14px;font-size:.85rem;color:var(--muted);line-height:1.5;">Une fois installée, tu retrouves ton calendrier en un tap, sans passer par tes messages — et tu peux activer les notifications pour être prévenu dès que ton praticien modifie ton planning.</p>';
  html += '<ol style="margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:14px;">';
  steps.forEach(function (s) {
    html += '<li style="font-size:.85rem;line-height:1.4;"><div style="font-weight:700;color:var(--text);margin-bottom:2px;">' + s[0] + '</div><div style="color:var(--muted);font-size:.78rem;">' + s[1] + '</div></li>';
  });
  html += '</ol>';
  return html;
}
function openInstallGuide() {
  var body = document.getElementById('installModalBody');
  if (body) body.innerHTML = _installGuideHtml();
  var m = document.getElementById('installModal');
  if (m) m.classList.add('open');
  try { localStorage.setItem('r4p-install-guide-seen', String(Date.now())); } catch (e) {}
}
function closeInstallGuide() {
  var m = document.getElementById('installModal');
  if (m) m.classList.remove('open');
}
function _maybeOfferInstallGuide() {
  if (_isStandalone()) { var b = document.getElementById('installBtn'); if (b) b.style.display = 'none'; return; }
  if (typeof _patientId === 'undefined' || !_patientId || _kineMode) return;
  try { if (localStorage.getItem('r4p-install-guide-seen')) return; } catch (e) {}
  setTimeout(openInstallGuide, 900);
}
</script>
