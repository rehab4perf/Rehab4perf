    + '<h2>'+escH(label)+'</h2>'
    + '<button class="cal-nav-btn" onclick="calMove(1)">▶</button>'
    + '<button class="cal-today-btn" onclick="goToToday()">Aujourd\'hui</button>'
    + '<div class="view-toggle">'
    + '<button class="view-btn'+(_calView==='month'?' active':'')+'" onclick="setCalView(\'month\')">📅 Mois</button>'
    + '<button class="view-btn'+(_calView==='week'?' active':'')+'" onclick="setCalView(\'week\')">📋 Sem.</button>'
    + '<button class="view-btn'+(_calView==='day'?' active':'')+'" onclick="setCalView(\'day\')">📆 Jour</button>'
    + '</div>'
    + '</div>';
}

/* ── Protocole actif (LCA, Latarjet, etc.) : phase en cours + critères ── */
function _loadActiveProto(){
  fetch(SUPA_URL + '/rest/v1/patient_protocols?patient_id=eq.' + _patientId
      + '&status=eq.active&order=started_at.desc&limit=1&select=*', {
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
  }).then(function(r){ return r.json(); })
  .then(function(rows){
    var pp = Array.isArray(rows) && rows[0] ? rows[0] : null;
    if(!pp){ _activeProtoData = null; _renderProtoSection(); return; }
    var pratId = pp.praticien_id || _pratId;
    if(!pratId){ _activeProtoData = null; _renderProtoSection(); return; }
    Promise.all([
      fetch(SUPA_URL + '/rest/v1/templates?nom=eq.__r4p_protocols_meta__&praticien_id=eq.' + pratId + '&select=donnees&limit=1', {
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
      }).then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch(SUPA_URL + '/rest/v1/protocol_criteria_checks?patient_protocol_id=eq.' + pp.id + '&select=phase_id,criteria_index,checked', {
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
      }).then(function(r){ return r.json(); }).catch(function(){ return []; })
    ]).then(function(res){
      var tplRows = res[0], checkRows = res[1];
      var donnees = tplRows && tplRows[0] && tplRows[0].donnees;
      if(typeof donnees === 'string'){ try{ donnees = JSON.parse(donnees); }catch(e){ donnees = null; } }
      var protocols = (donnees && Array.isArray(donnees.protocols)) ? donnees.protocols : [];
      var proto = protocols.find(function(p){ return p.id === pp.protocol_id; });
      var phase = proto && (proto.phases||[]).find(function(ph){ return ph.id === pp.current_phase_id; });
      var checks = {};
      (checkRows||[]).forEach(function(c){
        if(c.phase_id !== pp.current_phase_id) return;
        checks[c.criteria_index] = !!c.checked;
      });
      _activeProtoData = (proto && phase) ? { pp:pp, proto:proto, phase:phase, checks:checks } : null;
      _renderProtoSection();
    }).catch(function(){ _activeProtoData = null; _renderProtoSection(); });
  }).catch(function(){ _activeProtoData = null; _renderProtoSection(); });
}

function _renderProtoSection(){
  var el = document.getElementById('proto-banner-slot');
  if(el) el.innerHTML = _buildProtoBanner();
}

var _PROTO_ICO_CHECK  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var _PROTO_ICO_CIRCLE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8C0CC" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';

function _buildProtoBanner(){
  var d = _activeProtoData;
  if(!d) return '';
  var items = d.phase.exitCriteria || [];
  var total = items.length;
  var done  = items.filter(function(_, i){ return !!d.checks[i]; }).length;
  var pct   = total ? Math.round(done/total*100) : 0;
  var allDone = total > 0 && done === total;
  var phaseIdx = (d.proto.phases||[]).findIndex(function(p){ return p.id === d.phase.id; });
  var phaseLabel = (d.phase.name||'').replace(/^Phase \d+\s*—\s*/,'');

  var html = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;">';
  html += '<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">Mon protocole</div>';
  html += '<div style="font-size:.88rem;font-weight:700;color:var(--navy);">'+escH(d.pp.protocol_name||d.proto.name)+'</div>';
  html += '<div style="font-size:.78rem;color:var(--text);margin-top:2px;">Phase '+(phaseIdx+1)+(phaseLabel?' — '+escH(phaseLabel):'')+'</div>';

  if(total){
    html += '<div style="display:flex;align-items:center;gap:8px;margin-top:9px;">'
      + '<div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;">'
      + '<div style="width:'+pct+'%;height:100%;background:var(--accent);border-radius:3px;"></div>'
      + '</div>'
      + '<span style="font-size:.68rem;color:var(--muted);white-space:nowrap;">'+done+' / '+total+'</span>'
      + '</div>';
  }

  if(allDone){
    html += '<div style="margin-top:9px;font-size:.72rem;font-weight:700;color:#16A34A;background:#EFFAF0;border-radius:6px;padding:6px 10px;">'
      + '✓ Phase terminée — en attente de validation par votre praticien</div>';
  }

  if(total){
    html += '<ul style="list-style:none;padding:0;margin:10px 0 0;">';
    items.forEach(function(c, i){
      var ok = !!d.checks[i];
      html += '<li style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:.78rem;'+(ok?'color:var(--text);':'color:var(--muted);')+'">'
        + '<span style="flex-shrink:0;margin-top:2px;">'+(ok?_PROTO_ICO_CHECK:_PROTO_ICO_CIRCLE)+'</span>'
        + '<span>'+escH(c)+'</span></li>';
    });
    html += '</ul>';
  }

  html += '</div>';
  return html;
}

/* ── Bandeau cycle actuel + légende accordéon ── */
function _toggleCycleLegend(){
  _cycleLegendOpen = !_cycleLegendOpen;
  var panel = document.getElementById('cycle-legend-panel');
  var caret = document.getElementById('cycle-legend-caret');
  if(panel) panel.style.display = _cycleLegendOpen ? 'block' : 'none';
  if(caret) caret.textContent = _cycleLegendOpen ? '▲' : '▼';
}

var _CYCLE_ICO_CHECK  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var _CYCLE_ICO_CIRCLE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';

function _buildCycleBanner(){
  if(!_calCycles || !_calCycles.length) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var MC = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

  /* TOUS les cycles en cours, pas le premier. La boucle s'arretait au premier
     trouve (`break`), si bien qu'un seul bandeau s'affichait meme quand deux
     voies tournaient ensemble — l'athlete ne voyait que la moitie de ce qu'on
     lui demande. */
  var courants = [];
  for(var i=0;i<_calCycles.length;i++){ if(_cycleIsCurrent(_calCycles, i, today)) courants.push(_calCycles[i]); }

  var html = '';

  courants.forEach(function(cur){
  if(cur.mode === 'criteres'){
    var phases = _cyclePhases(cur);
    var curPh = _cyclePhaseCurrentIndex(cur);
    var showIdx = curPh < 0 ? phases.length-1 : curPh;
    var ph = phases[showIdx] || { criteria:[], checks:{} };
    var items = ph.criteria||[];
    var done = items.filter(function(_,i){ return ph.checks && ph.checks[i] && ph.checks[i].checked; }).length;
    var col = cur.color || _cycleColor(cur.nom);
    var phLabel = phases.length>1
      ? 'Phase '+(showIdx+1)+' / '+phases.length + (ph.nom ? ' — '+ph.nom : '')
      : (ph.nom || '');
    html += '<div style="background:'+col+';border-radius:12px;padding:14px 16px;margin-bottom:10px;">'
      +'<div style="font-size:.65rem;color:rgba(255,255,255,.75);margin-bottom:1px;">Cycle en cours</div>'
      +'<div style="font-size:.88rem;font-weight:700;color:#fff;">'+escH(cur.nom)+'</div>'
      +(phLabel ? '<div style="font-size:.75rem;color:rgba(255,255,255,.9);margin-top:2px;">'+escH(phLabel)+'</div>' : '')
      +(cur.note ? '<div style="font-size:.72rem;color:rgba(255,255,255,.85);margin-top:2px;">'+escH(cur.note)+'</div>' : '');
    if(phases.length>1){
      var pctPh = Math.round((phases.filter(_cyclePhaseIsDone).length/phases.length)*100);
      html += '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">'
        +'<div style="flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;">'
        +'<div style="width:'+pctPh+'%;height:100%;background:rgba(255,255,255,.9);border-radius:2px;"></div>'
        +'</div></div>';
    }
    html += '<div style="font-size:.68rem;color:rgba(255,255,255,.85);margin-top:8px;">'+done+' / '+items.length+' critères validés</div>'
      +'<ul style="list-style:none;padding:0;margin:8px 0 0;">'
      + items.map(function(txt,i){
          var ok = !!(ph.checks && ph.checks[i] && ph.checks[i].checked);
          return '<li style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.78rem;color:'+(ok?'#fff':'rgba(255,255,255,.75)')+';">'
            + '<span style="flex-shrink:0;margin-top:1px;">'+(ok?_CYCLE_ICO_CHECK:_CYCLE_ICO_CIRCLE)+'</span><span>'+escH(txt)+'</span></li>';
        }).join('')
      +'</ul>'
      +'</div>';
  } else {
    var cyS = new Date(cur.startDate); cyS.setHours(0,0,0,0);
    var cyE = _cyEndDate(cur);
    var wk  = Math.floor((today-cyS)/(7*24*3600*1000))+1;
    var pct = Math.min(100, Math.round(wk/cur.duree*100));
    var col = cur.color || _cycleColor(cur.nom);
    var endLbl = cyE.getDate()+' '+MC[cyE.getMonth()];
    html += '<div style="background:'+col+';border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;">'
      +'<div style="width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.25rem;">⚡</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:.65rem;color:rgba(255,255,255,.75);margin-bottom:1px;">Cycle en cours</div>'
      +'<div style="font-size:.88rem;font-weight:700;color:#fff;">'+escH(cur.nom)+'</div>'
      +(cur.note ? '<div style="font-size:.72rem;color:rgba(255,255,255,.85);margin-top:2px;">'+escH(cur.note)+'</div>' : '')
      +'<div style="display:flex;align-items:center;gap:8px;margin-top:5px;">'
      +'<div style="flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;">'
      +'<div style="width:'+pct+'%;height:100%;background:rgba(255,255,255,.9);border-radius:2px;"></div>'
      +'</div>'
      +'<span style="font-size:.68rem;color:rgba(255,255,255,.85);white-space:nowrap;">Sem. '+wk+' / '+cur.duree+'</span>'
      +'</div>'
      +'</div>'
      +'<div style="text-align:right;flex-shrink:0;">'
      +'<div style="font-size:.62rem;color:rgba(255,255,255,.7);">Se termine le</div>'
      +'<div style="font-size:.78rem;font-weight:600;color:#fff;">'+endLbl+'</div>'
      +'</div>'
      +'</div>';
  }
  });

  // Accordéon légende complète
  html += '<div style="margin-bottom:12px;">'
    +'<button onclick="_toggleCycleLegend()" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:.74rem;font-weight:700;color:var(--navy);font-family:inherit;">'
    +'<span>📅 Plan de cycles</span>'
    +'<span id="cycle-legend-caret" style="font-size:.62rem;color:var(--muted);transition:transform .2s;">'+(_cycleLegendOpen?'▲':'▼')+'</span>'
    +'</button>'
    +'<div id="cycle-legend-panel" style="display:'+(_cycleLegendOpen?'block':'none')+';background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:4px 14px 10px;">';

  /* Les cycles TERMINES ne sont plus listes : l'athlete regarde ce qu'il a a
     faire, pas ce qu'il a deja fait. Rien n'est supprime — ils restent dans le
     plan, teintent toujours leurs journees passees sur le calendrier, et
     reapparaissent si leur etat change.

     Les indices RESTENT ceux du tableau complet : `_cycleIsCurrent` lit les
     cycles qui precedent pour ordonner la voie criteres. Reindexer sur la
     liste filtree lui ferait perdre de vue les cycles termines — c'est-a-dire
     exactement ceux qui debloquent le suivant. */
  var _restants = [];
  _calCycles.forEach(function(cy, i){ if(!_cycleIsDone(cy, today)) _restants.push(i); });

  if(!_restants.length){
    html += '<div style="padding:10px 2px;font-size:.75rem;color:var(--muted);text-align:center;">'
      + 'Tous les cycles du plan sont terminés.</div>';
  }

  _restants.forEach(function(i, rang){
    var cy = _calCycles[i];
    var col = cy.color || _cycleColor(cy.nom);
    /* Recalcule PAR LIGNE : plusieurs cycles peuvent etre en cours a la fois,
       un par voie. La ligne se lisait auparavant sur le seul cycle du bandeau
       (`i === curIdx`), ce qui n'en laissait qu'un. */
    var isCur  = _cycleIsCurrent(_calCycles, i, today);
    var status, sBg, sTxt;
    if(isCur){ status='En cours'; sBg=col+'28'; sTxt=col; }
    else { status='À venir'; sBg='rgba(107,122,141,.1)'; sTxt='var(--muted)'; }
    /* Le dernier de ce qui RESTE, pas du plan : sinon le trait de separation
       s'arretait avant la derniere ligne visible. */
    var isLast = (rang === _restants.length-1);
    var subLine;
    if(cy.mode === 'criteres'){
      var phs = _cyclePhases(cy);
      var donePh = phs.filter(_cyclePhaseIsDone).length;
      var curPhL = _cyclePhaseCurrentIndex(cy);
      subLine = (phs.length>1
          ? 'Phase '+(curPhL<0?phs.length:curPhL+1)+' / '+phs.length
          : donePh+' / '+phs.length+' phase')
        + (cy.startDate ? ' · depuis le '+_fmtCyDate(cy.startDate,MC) : '');
    } else if(cy.startDate){
      var e = _cyEndDate(cy);
      subLine = _fmtCyDate(cy.startDate,MC,true)+' – '+_fmtCyDate(e.toISOString().slice(0,10),MC,true)+' · '+cy.duree+' sem.';
    } else {
      subLine = cy.duree+' sem.';
    }
    html += '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;'+(isLast?'':'border-bottom:1px solid var(--border);')+'">'
      +'<div style="width:10px;height:10px;border-radius:50%;background:'+col+';flex-shrink:0;"></div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:.8rem;font-weight:600;color:var(--text);">'+escH(cy.nom)+'</div>'
      +'<div style="font-size:.67rem;color:var(--muted);">'+subLine+'</div>'
      +(cy.note ? '<div style="font-size:.68rem;color:var(--text);margin-top:2px;">'+escH(cy.note)+'</div>' : '')
      +'</div>'
      +'<span style="font-size:.67rem;font-weight:600;background:'+sBg+';color:'+sTxt+';border-radius:5px;padding:3px 8px;white-space:nowrap;">'+status+'</span>'
      +'</div>';
  });

  html += '</div></div>';
  return html;
}
function _fmtCyDate(str, MC, withYear){
  var d = new Date(str+'T00:00:00');
  return d.getDate()+' '+MC[d.getMonth()]+(withYear?' '+d.getFullYear():'');
}

/* ── Bloc "Prochaines séances" commun ── */
function _buildUpcomingHtml(){
  var MOIS_COURTS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  var upcoming = _calEvents
    .filter(function(e){ return e.date >= new Date().toISOString().split('T')[0]; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); })
    .slice(0,5);
  if(!upcoming.length) return '';
  var html = '<div style="margin-top:16px;">'
    + '<div style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Prochaines séances</div>';
  upcoming.forEach(function(ev){
    var nom = (ev.programmes&&ev.programmes.nom)||'Programme';
    var p = ev.date.split('-');
    var dateLabel = parseInt(p[2])+' '+MOIS_COURTS[parseInt(p[1])-1];
    var fb2 = ev.athlete_feedback;
    var ua2 = (fb2&&fb2.rpe&&fb2.duree_min) ? fb2.rpe*fb2.duree_min : null;
    var uaTag = ua2 ? '<span style="font-size:.7rem;font-weight:800;color:'+_uaColor(ua2)+';background:#F5F7FA;border-radius:5px;padding:2px 7px;margin-left:4px;">⚡ '+ua2+' UA</span>' : '';
    html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openProgModal(\''+escH(ev.programme_id)+'\',\''+escH(ev.id)+'\')">'
          + '<div style="background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:.7rem;font-weight:700;white-space:nowrap;">'+escH(dateLabel)+'</div>'
          + '<div style="font-size:.85rem;font-weight:600;flex:1;">📋 '+escH(nom)+uaTag+'</div>'
          + '<div style="color:var(--muted);font-size:.8rem;">›</div>'
          + '</div>';
  });
  return html + '</div>';
}

/* ── Rendu principal — dispatch mois / semaine / jour ── */
function _renderCalGrid(){
  var html = _buildCycleBanner();
  html += '<div id="proto-banner-slot">'+_buildProtoBanner()+'</div>';
  if(_calView === 'week')     html += _buildWeekHtml();
  else if(_calView === 'day') html += _buildDayHtml();
  else                        html += _buildMonthHtml();
  html += _buildUpcomingHtml();
  document.getElementById('mainContent').innerHTML = html;
}

/* ── Vue MOIS ── */
function _buildMonthHtml(){
  var first = new Date(_calYear, _calMonth, 1);
  var startDow = (first.getDay()+6)%7;
  var daysInMonth = new Date(_calYear, _calMonth+1, 0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);

  var headers = DAYS.map(function(d){ return '<div class="cal-day-header">'+d+'</div>'; }).join('');
  var cells = '';
  for(var i=0;i<startDow;i++) cells += '<div class="cal-day other-month"></div>';

  for(var d=1;d<=daysInMonth;d++){
    var dateStr = _calYear+'-'+String(_calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cellDate = new Date(_calYear,_calMonth,d);
    var isToday = cellDate.getTime()===today.getTime();
    var dayEvs = _calEvents.filter(function(e){ return e.date===dateStr; });
    var dayMsgsCell = _calMessages.filter(function(m){ return m.date===dateStr; });
    var dayCliNotes = _calClinicalNotes.filter(function(n){ return n.date===dateStr; });
    var dayStrava = _stravaActs.filter(function(a){ return a.date===dateStr; });
    var chips, msgChips, cliChips;
    if(_isMobile){
      // Mobile : un dot coloré par séance/message — tap ouvre vue Jour
      var dots = dayEvs.map(function(ev){
        var fb=ev.athlete_feedback, ua=(fb&&fb.rpe&&fb.duree_min)?fb.rpe*fb.duree_min:null;
        return '<span class="cal-dot" style="background:'+(ua?_uaColor(ua):'var(--accent)')+'"></span>';
      }).join('')
        + dayStrava.map(function(){ return '<span class="cal-dot" style="background:#FC4C02"></span>'; }).join('')
        + (dayMsgsCell.length ? '<span class="cal-dot" style="background:#4338CA"></span>' : '')
        + (dayCliNotes.length ? '<span class="cal-dot" style="background:#64748b"></span>' : '');
      chips    = dots ? '<div class="cal-dots">'+dots+'</div>' : '';
      msgChips = ''; cliChips = '';
    } else {
      // Desktop : max 1 chip séance + max 1 chip message (+ note clinique si kine) + badge "+N autres"
      var usedStravas = {};
      chips = dayEvs.slice(0,1).map(function(ev){
        var nom=(ev.programmes&&ev.programmes.nom)||'Programme';
        var fb=ev.athlete_feedback, ua=(fb&&fb.rpe&&fb.duree_min)?fb.rpe*fb.duree_min:null;
        var uaBadge=ua?'<span class="chip-ua" style="color:'+_uaColor(ua)+';">⚡'+ua+'</span>':'';
        // Strava match pour CAP / Vélo
        var mProgDType=ev.programmes&&ev.programmes.donnees&&ev.programmes.donnees.type;
        var isRunProg=nom.indexOf('CAP —')===0||mProgDType==='cap';
        var isVeloProg=nom.indexOf('Vélo —')===0;
        var matchTypes=isRunProg?['Run','TrailRun','Walk']:isVeloProg?['Ride','VirtualRide']:[];
        var matched=matchTypes.length?dayStrava.find(function(a){ return matchTypes.indexOf(a.type)!==-1&&!usedStravas[a.strava_id]; }):null;
        if(matched) usedStravas[matched.strava_id]=true;
        var sd=matched&&matched.distance_m>=1000?(matched.distance_m/1000).toFixed(1)+'km':matched&&matched.distance_m>0?matched.distance_m+'m':'';
        var st=matched&&matched.duree_s>0?Math.round(matched.duree_s/60)+'min':'';
        var sinfo=[sd,st].filter(Boolean).join(' ');
        var sBadge=matched&&sinfo?'<span style="font-size:.55rem;background:#FC4C02;color:#fff;border-radius:3px;padding:0 3px;font-weight:700;">S '+sinfo+'</span>':'';
        return '<div class="cal-chip" onclick="event.stopPropagation();openProgModal(\''+escH(ev.programme_id)+'\',\''+escH(ev.id)+'\')" title="'+escH(nom)+'">'
             +'📋 '+escH(nom.length>10?nom.slice(0,10)+'…':nom)+uaBadge+sBadge+'</div>';
      }).join('');
      msgChips = dayMsgsCell.slice(0,1).map(function(m){
        var lbl=m.title||(m.body?m.body.slice(0,18)+(m.body.length>18?'…':''):'Message');
        return '<div class="cal-msg-chip" onclick="event.stopPropagation();_openMsgModal(\''+escH(m.id)+'\')" title="'+escH((m.title?m.title+'\n':'')+m.body)+'">💬 '+escH(lbl)+'</div>';
      }).join('');
      cliChips = dayCliNotes.slice(0,1).map(function(n){
        var lbl=(n.title||(n.body?n.body.slice(0,18)+(n.body.length>18?'…':''):'Note clinique'));
        return '<div class="cal-chip" style="background:#f1f5f9;color:#64748b;border-color:#cbd5e1;" title="'+escH((n.title?n.title+'\n':'')+n.body)+'">🔒 '+escH(lbl.length>12?lbl.slice(0,12)+'…':lbl)+'</div>';
      }).join('');
      // Strava : seulement les activités non absorbées dans une séance planifiée
      var unmatchedStrava=dayStrava.filter(function(a){ return !usedStravas[a.strava_id]; });
      var stravaChips = unmatchedStrava.slice(0,1).map(function(act){
        var tmap={Run:'🏃',Ride:'🚴',Swim:'🏊',Walk:'🚶',WeightTraining:'💪',Hike:'🥾',TrailRun:'🏔️'};
        var emoji=tmap[act.type]||'⚡';
        var dist=act.distance_m>0?(act.distance_m>=1000?(act.distance_m/1000).toFixed(1)+'km':act.distance_m+'m'):'';
        var label=(act.nom||act.type||'Strava').slice(0,10);
        return '<div class="cal-chip" style="background:#FC4C02;color:#fff;border-color:#FC4C02;cursor:default;" title="'+escH((act.nom||act.type||'')+(dist?' — '+dist:''))+'">'+emoji+' '+escH(label)+(dist?' <span style="font-size:.58rem;font-weight:800;opacity:.85;">'+dist+'</span>':'')+'</div>';
      }).join('');
      chips += stravaChips;
      var shownCount=(dayEvs.length>0?1:0)+(dayMsgsCell.length>0?1:0)+(dayCliNotes.length>0?1:0)+(unmatchedStrava.length>0?1:0);
      var extraCount=dayEvs.length+dayMsgsCell.length+dayCliNotes.length+unmatchedStrava.length-shownCount;
      if(extraCount>0) chips+='<div class="cal-more" onclick="event.stopPropagation();jumpToDay(\''+dateStr+'\')">+'+extraCount+' autre'+(extraCount>1?'s':'')+'</div>';
    }
    var cycleBg = _dayCycleBg(cellDate);
    var cycleStartPill = '';
    _calCycles.forEach(function(cy){
      if(!cy.startDate) return;
      var cs = new Date(cy.startDate); cs.setHours(0,0,0,0);
      if(cs.getTime()===cellDate.getTime()){
        var ccol = cy.color||_cycleColor(cy.nom);
        var cshort = cy.nom.length>9 ? cy.nom.slice(0,9)+'…' : cy.nom;
        cycleStartPill = '<div style="font-size:.52rem;font-weight:700;color:'+ccol+';background:'+ccol+'22;border-radius:3px;padding:1px 5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">↪ '+escH(cshort)+'</div>';
      }
    });
    cells += '<div class="cal-day'+(isToday?' today':'')+'"'
           + (cycleBg?' style="background-color:'+cycleBg+';"':'')
           + ' onclick="jumpToDay(\''+dateStr+'\')">'
           + '<div class="cal-day-num">'+d+'</div>'
           + cycleStartPill
           + chips+msgChips+(cliChips||'')+'</div>';
  }

  return _buildCalNav(MONTHS[_calMonth]+' '+_calYear)
    + '<div class="cal-grid">'+headers+cells+'</div>';
}

/* ── Vue SEMAINE (7j desktop / 3j mobile) ── */
function _buildWeekHtml(){
  var today = new Date(); today.setHours(0,0,0,0);
  var MOIS_COURTS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  var numDays = _isMobile ? 3 : 7;
  var days = [];
  for(var i=0;i<numDays;i++){
    var d = new Date(_calWeekStart);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  // Label de la barre nav
  var d0 = days[0], dLast = days[numDays-1];
  var navLabel;
  if(d0.getMonth()===dLast.getMonth()){
    navLabel = d0.getDate()+'–'+dLast.getDate()+' '+MONTHS[d0.getMonth()]+' '+d0.getFullYear();
  } else {
    navLabel = d0.getDate()+' '+MOIS_COURTS[d0.getMonth()]
             + ' – '+dLast.getDate()+' '+MOIS_COURTS[dLast.getMonth()]
             + ' '+dLast.getFullYear();
  }

  var html = _buildCalNav(navLabel);
  html += '<div class="week-grid" style="grid-template-columns:repeat('+numDays+',1fr);">';
  days.forEach(function(day){
    var dateStr = day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');
    var isToday = day.getTime()===today.getTime();
    var dow = day.getDay()===0 ? 6 : day.getDay()-1; // 0=Lun … 6=Dim
    var dayEvs = _calEvents.filter(function(e){ return e.date===dateStr; });

    var weekCycleBg = _dayCycleBg(day);
    var weekCycleTag = '';
    _calCycles.forEach(function(cy){
      if(!cy.startDate) return;
      var wcs = new Date(cy.startDate); wcs.setHours(0,0,0,0);
      if(wcs.getTime()===day.getTime()){
        var wcol = cy.color||_cycleColor(cy.nom);
        var wshort = cy.nom.length>7 ? cy.nom.slice(0,7)+'…' : cy.nom;
        weekCycleTag = '<div style="font-size:.52rem;font-weight:700;color:'+wcol+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">↪ '+escH(wshort)+'</div>';
      }
    });
    html += '<div class="week-col'+(isToday?' today':'')+'"'+(weekCycleBg?' style="background-color:'+weekCycleBg+';"':'')+'>'+
            '<div class="week-col-header" onclick="jumpToDay(\''+dateStr+'\')" style="cursor:pointer;" title="Voir le détail du jour">'
          + '<div class="week-day-name">'+DAYS[dow]+'</div>'
          + '<div class="week-day-num'+(isToday?' today':'')+'">'+day.getDate()+'</div>'
          + weekCycleTag
          + '</div><div class="week-col-body">';

    var weekUsedStravas = {};
    var dayStravaWeek = _stravaActs.filter(function(a){ return a.date===dateStr; });
    dayEvs.forEach(function(ev){
      var nom = (ev.programmes&&ev.programmes.nom)||'Programme';
      var fb = ev.athlete_feedback;
      var ua = (fb&&fb.rpe&&fb.duree_min) ? fb.rpe*fb.duree_min : null;
      var uaHtml = ua ? '<div class="week-event-ua" style="color:'+_uaColor(ua)+';">⚡'+ua+' UA</div>' : '';
      var wpDType=ev.programmes&&ev.programmes.donnees&&ev.programmes.donnees.type;
      var isRunProg=nom.indexOf('CAP —')===0||wpDType==='cap';
      var isVeloProg=nom.indexOf('Vélo —')===0;
      var wTypes=isRunProg?['Run','TrailRun','Walk']:isVeloProg?['Ride','VirtualRide']:[];
      var wMatch=wTypes.length?dayStravaWeek.find(function(a){ return wTypes.indexOf(a.type)!==-1&&!weekUsedStravas[a.strava_id]; }):null;
      if(wMatch) weekUsedStravas[wMatch.strava_id]=true;
      var wsd=wMatch&&wMatch.distance_m>=1000?(wMatch.distance_m/1000).toFixed(1)+'km':wMatch&&wMatch.distance_m>0?wMatch.distance_m+'m':'';
      var wst=wMatch&&wMatch.duree_s>0?Math.round(wMatch.duree_s/60)+'min':'';
      var wsInfo=[wsd,wst].filter(Boolean).join(' ');
      var wBadge=wMatch&&wsInfo?'<div class="week-event-ua" style="color:#FC4C02;">S '+wsInfo+'</div>':'';
      html += '<div class="week-event" onclick="openProgModal(\''+escH(ev.programme_id)+'\',\''+escH(ev.id)+'\')">'
            + '<div class="week-event-name">📋 '+escH(nom)+'</div>'
            + uaHtml+wBadge+'</div>';
    });

    _calMessages.filter(function(m){ return m.date===dateStr; }).forEach(function(m){
      var lbl = m.title || (m.body ? m.body.slice(0,20)+(m.body.length>20?'…':'') : 'Message');
      html += '<div class="cal-msg-chip" style="margin:2px 0;" onclick="event.stopPropagation();_openMsgModal(\''+escH(m.id)+'\')">💬 '+escH(lbl)+'</div>';
    });

    _calClinicalNotes.filter(function(n){ return n.date===dateStr; }).forEach(function(n){
      var lbl = n.title || (n.body ? n.body.slice(0,20)+(n.body.length>20?'…':'') : 'Note clinique');
      html += '<div class="cal-chip" style="margin:2px 0;background:#f1f5f9;color:#64748b;border-color:#cbd5e1;" title="'+escH((n.title?n.title+'\n':'')+n.body)+'">🔒 '+escH(lbl)+'</div>';
    });

    _stravaActs.filter(function(a){ return a.date===dateStr&&!weekUsedStravas[a.strava_id]; }).forEach(function(act){
      var tmap={Run:'🏃',Ride:'🚴',Swim:'🏊',Walk:'🚶',WeightTraining:'💪',Hike:'🥾',TrailRun:'🏔️'};
      var emoji=tmap[act.type]||'⚡';
      var dist=act.distance_m>0?(act.distance_m>=1000?(act.distance_m/1000).toFixed(1)+' km':act.distance_m+' m'):'';
      var dur=act.duree_s>0?Math.round(act.duree_s/60)+' min':'';
      var meta=[dist,dur].filter(Boolean).join(' · ');
      html += '<div class="week-event" style="background:#FFF3EE;border-color:#FC4C02;cursor:default;" title="'+escH((act.nom||act.type||'')+(meta?' — '+meta:''))+'">'
            + '<div class="week-event-name" style="color:#FC4C02;">'+emoji+' '+escH((act.nom||act.type||'Activité').slice(0,22))+'</div>'
            + (meta ? '<div class="week-event-ua" style="color:#FC4C02;">'+escH(meta)+'</div>' : '')
            + '</div>';
    });

    // Cycles : fond coloré sur la colonne, pas de chip

    var dayMsgs = _calMessages.filter(function(m){ return m.date===dateStr; });
    var dayCli  = _calClinicalNotes.filter(function(n){ return n.date===dateStr; });
    if(!dayEvs.length && !dayMsgs.length && !dayCli.length) html += '<div class="week-empty">—</div>';
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

/* ── Vue JOUR ── */
function _buildDayHtml(){
  var DAYS_FULL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var MOIS_COURTS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  var today = new Date(); today.setHours(0,0,0,0);
  var day = _calDayDate;
  var isToday = day.getTime() === today.getTime();
  var dateStr = day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');
  var navLabel = DAYS_FULL[day.getDay()]+' '+day.getDate()+' '+MOIS_COURTS[day.getMonth()]+' '+day.getFullYear();
  var dayEvs = _calEvents.filter(function(e){ return e.date===dateStr; });

  var html = _buildCalNav(navLabel);

  // Badge jour actuel
  if(isToday){
    html += '<div style="text-align:center;font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:10px;letter-spacing:.04em;">— Aujourd\'hui —</div>';
  }

  // Cycles actifs ce jour
  var cyclesHtml = '';
  _calCycles.forEach(function(cy){
    if(!cy.startDate) return;
    var cyStart = new Date(cy.startDate); cyStart.setHours(0,0,0,0);
    var cyEnd = _cyEndDate(cy);
    if(day>=cyStart && day<=cyEnd){
      var weekNum = Math.floor((day-cyStart)/(7*24*3600*1000))+1;
      var col = _cycleColor(cy.nom);
      cyclesHtml += '<div style="background:'+col+';color:#fff;border-radius:8px;padding:8px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">'
        + '<span style="font-size:.8rem;font-weight:700;">⚡ '+escH(cy.nom)+'</span>'
        + '<span style="font-size:.72rem;opacity:.85;margin-left:auto;">Semaine '+weekNum+' / '+cy.duree+'</span>'
        + '</div>';
    }
  });
  if(cyclesHtml) html += cyclesHtml;

  var dayMsgs = _calMessages.filter(function(m){ return m.date===dateStr; });
  var dayCliNotes = _calClinicalNotes.filter(function(n){ return n.date===dateStr; });
  var dayStrava = _stravaActs.filter(function(a){ return a.date===dateStr; });

  // Séances du jour
  if(!dayEvs.length && !dayMsgs.length && !dayCliNotes.length && !dayStrava.length){
    html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 16px;text-align:center;color:var(--muted);">'
          + '<div style="font-size:2rem;margin-bottom:10px;">😴</div>'
          + '<div style="font-size:.88rem;font-weight:600;">Pas de séance prévue ce jour</div>'
          + '</div>';
  } else {
    var dayUsedStravas = {};
    dayEvs.forEach(function(ev){
      var nom = (ev.programmes&&ev.programmes.nom)||'Programme';
      var fb = ev.athlete_feedback;
      var ua = (fb&&fb.rpe&&fb.duree_min) ? fb.rpe*fb.duree_min : null;
      var uaTag = ua ? '<span style="font-size:.75rem;font-weight:800;color:'+_uaColor(ua)+';background:#F5F7FA;border-radius:6px;padding:3px 9px;">⚡ '+ua+' UA</span>' : '';
      var dpDType=ev.programmes&&ev.programmes.donnees&&ev.programmes.donnees.type;
      var isRunProg=nom.indexOf('CAP —')===0||dpDType==='cap';
      var isVeloProg=nom.indexOf('Vélo —')===0;
      var matchTypes=isRunProg?['Run','TrailRun','Walk']:isVeloProg?['Ride','VirtualRide']:[];
      var matched=matchTypes.length?dayStrava.find(function(a){ return matchTypes.indexOf(a.type)!==-1&&!dayUsedStravas[a.strava_id]; }):null;
      if(matched) dayUsedStravas[matched.strava_id]=true;
      var stravaSection='';
      if(matched){
        var dsd=matched.distance_m>=1000?(matched.distance_m/1000).toFixed(1)+' km':matched.distance_m>0?matched.distance_m+' m':'';
        var dst=matched.duree_s>0?Math.round(matched.duree_s/60)+' min':'';
        var dsInfo=[dsd,dst].filter(Boolean).join(' · ');
        stravaSection='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">'
          +'<svg width="13" height="13" viewBox="0 0 24 24" fill="#FC4C02"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>'
          +'<span style="font-size:.75rem;font-weight:700;color:#FC4C02;">Strava'+(dsInfo?' · '+escH(dsInfo):'')+'</span>'
          +'</div>';
      }
      html += '<div style="background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;" onclick="openProgModal(\''+escH(ev.programme_id)+'\',\''+escH(ev.id)+'\')" onmouseover="this.style.boxShadow=\'0 4px 16px rgba(43,95,166,.18)\'" onmouseout="this.style.boxShadow=\'none\'">'
            + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
            + '<div style="font-size:1rem;font-weight:700;color:var(--navy);flex:1;">📋 '+escH(nom)+'</div>'
            + uaTag
            + '</div>'
            + '<div style="font-size:.75rem;color:var(--accent);font-weight:600;">Voir le programme  ›</div>'
            + stravaSection
            + '</div>';
    });
    // Messages patient du jour
    dayMsgs.forEach(function(m){
      html += '<div style="background:#EEF2FF;border:2px solid #C7D2FE;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;" onclick="_openMsgModal(\''+escH(m.id)+'\')">'
            + '<div style="font-size:.72rem;font-weight:700;color:#6366F1;margin-bottom:4px;letter-spacing:.04em;">💬 MESSAGE DE TON PRATICIEN</div>'
            + (m.title ? '<div style="font-size:.92rem;font-weight:700;color:#3730A3;margin-bottom:4px;">'+escH(m.title)+'</div>' : '')
            + '<div style="font-size:.82rem;color:#4338CA;white-space:pre-wrap;">'+escH(m.body ? (m.body.length>120 ? m.body.slice(0,120)+'…' : m.body) : '')+'</div>'
            + (m.body && m.body.length>120 ? '<div style="font-size:.72rem;color:#6366F1;margin-top:6px;font-weight:600;">Lire la suite ›</div>' : '')
            + '</div>';
    });
    // Notes cliniques (mode kiné uniquement)
    dayCliNotes.forEach(function(n){
      html += '<div style="background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;padding:14px 16px;margin-bottom:10px;">'
            + '<div style="font-size:.72rem;font-weight:700;color:#64748b;margin-bottom:4px;letter-spacing:.04em;">🔒 NOTE CLINIQUE</div>'
            + (n.title ? '<div style="font-size:.92rem;font-weight:700;color:#1e293b;margin-bottom:4px;">'+escH(n.title)+'</div>' : '')
            + '<div style="font-size:.82rem;color:#64748b;white-space:pre-wrap;">'+escH(n.body||'')+'</div>'
            + '</div>';
    });
    // Activités Strava du jour
    var tmap={Run:'🏃',Ride:'🚴',Swim:'🏊',Walk:'🚶',WeightTraining:'💪',Hike:'🥾',TrailRun:'🏔️',VirtualRide:'🚴',Rowing:'🚣'};
    dayStrava.filter(function(a){ return !dayUsedStravas[a.strava_id]; }).forEach(function(act){
      var emoji = tmap[act.type]||'⚡';
      var d     = act.donnees || {};
      var dist  = act.distance_m>0 ? (act.distance_m>=1000?(act.distance_m/1000).toFixed(2)+' km':act.distance_m+' m') : null;
      var dur   = act.duree_s>0 ? (Math.floor(act.duree_s/3600)>0?Math.floor(act.duree_s/3600)+'h ':'')+Math.round((act.duree_s%3600)/60)+'min' : null;
      var typeLabel = {Run:'Course',Ride:'Vélo',Swim:'Natation',Walk:'Marche',WeightTraining:'Musculation',Hike:'Randonnée',TrailRun:'Trail',VirtualRide:'Vélo virtuel',Rowing:'Aviron'}[act.type]||act.type||'Activité';
      var pace = (act.distance_m > 100 && act.duree_s) ? _fmtPace(act.duree_s/(act.distance_m/1000)) : null;
      var runLike = ['Run','TrailRun','Walk','Hike'].indexOf(act.type) !== -1;
      var pills = [
        ['DISTANCE', dist],
        ['DURÉE', dur],
        ['TYPE', escH(typeLabel)],
        (runLike && pace) ? ['ALLURE MOY.', pace+'/km'] : (d.avg_speed ? ['VITESSE MOY.', (d.avg_speed*3.6).toFixed(1)+' km/h'] : null),
        d.avg_hr ? ['FC MOY.', Math.round(d.avg_hr)+' bpm'] : null,
        d.max_hr ? ['FC MAX', Math.round(d.max_hr)+' bpm'] : null,
        d.elevation ? ['D+', Math.round(d.elevation)+' m'] : null,
        d.cadence ? ['CADENCE', Math.round(d.cadence*2)] : null,
        act.charge ? ['CHARGE', '⚡ '+act.charge+' UA'] : null
      ].filter(Boolean);
      var pillsHtml = pills.map(function(p){
        var color = (p[0]==='CHARGE') ? '#FC4C02' : '#1A1917';
        return '<div style="font-size:.82rem;"><span style="color:#9D6050;font-size:.7rem;font-weight:700;letter-spacing:.04em;display:block;">'+p[0]+'</span><span style="font-weight:700;color:'+color+';">'+p[1]+'</span></div>';
      }).join('');
      // Construit les barres d'allure (colonnes largeur fixe + scroll horizontal,
      // sinon les activites longues (49 splits, 105km) debordent du cadre).
      function _atBuildSplitBars(segs, labelFn, irregular){
        var paces = segs.map(function(s){ return (s.d > 0 && s.t > 0) ? s.t/(s.d/1000) : null; });
        var fullPaces = paces.filter(function(p,i){ return p && (irregular || segs[i].d >= 500); });
        if(fullPaces.length < 2) return '';
        var minP = Math.min.apply(null, fullPaces), maxP = Math.max.apply(null, fullPaces);
        var range = Math.max(maxP-minP, 1);
        return segs.map(function(s, i){
          var p = paces[i];
          if(!p) return '';
          var partial = !irregular && s.d < 500;
          // Hauteur en pixels absolus, pas en % : le conteneur immédiat de la barre
          // (colonne flex à hauteur auto) ne fournit aucune hauteur de référence pour
          // un height:XX%, qui serait alors ignoré par le navigateur (barre invisible).
          var barPx = 12 + Math.round((1 - (p-minP)/range) * 34);
          return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;flex:0 0 32px;width:32px;height:60px;">'
            + '<span style="font-size:.62rem;color:#9D6050;white-space:nowrap;">'+_fmtPace(p)+'</span>'
            + '<div style="width:70%;background:#FC4C02;border-radius:3px 3px 0 0;height:'+barPx+'px'+(partial?';opacity:.4':'')+'"></div>'
            + '<span style="font-size:.62rem;color:#9D6050;white-space:nowrap;">'+escH(labelFn(s,i))+'</span></div>';
        }).join('');
      }
      // Allures par kilomètre
      var splitsHtml = '';
      if(Array.isArray(d.splits) && d.splits.length > 1){
        var bars = _atBuildSplitBars(d.splits, function(s,i){
          return s.d < 500 ? (s.d/1000).toFixed(1).replace('.',',') : String(i+1);
        });
        if(bars){
          splitsHtml = '<div style="margin-top:10px;"><div style="font-size:.7rem;font-weight:700;color:#9D6050;letter-spacing:.04em;margin-bottom:6px;">ALLURE PAR KILOMÈTRE</div>'
            + '<div style="display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding-bottom:2px;">'+bars+'</div></div>';
        }
      }
      // Tours manuels (ex. 8x400m)
      var lapsHtml = '';
      if(Array.isArray(d.laps) && d.laps.length > 1){
        var lapBars = _atBuildSplitBars(d.laps, function(s,i){ return String(i+1); }, true);
        if(lapBars){
          var lapDists = d.laps.map(function(l){ return l.d; }).filter(function(v){ return v>0; });
          var sameLen = lapDists.length===d.laps.length && lapDists.every(function(v){ return Math.abs(v-lapDists[0])<25; });
          var lapTitle = sameLen ? (d.laps.length+' × '+(lapDists[0]>=1000?(lapDists[0]/1000).toFixed(2).replace('.',',')+' km':Math.round(lapDists[0])+' m')) : 'TOURS';
          lapsHtml = '<div style="margin-top:10px;"><div style="font-size:.7rem;font-weight:700;color:#9D6050;letter-spacing:.04em;margin-bottom:6px;">'+escH(lapTitle.toUpperCase())+'</div>'
            + '<div style="display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding-bottom:2px;">'+lapBars+'</div></div>';
        }
      }
      // Parcours
      var routeHtml = '';
      if(d.polyline){
        var svg = _polylineToSvg(d.polyline, 120, 90);
        if(svg) routeHtml = '<div style="flex-shrink:0;">'+svg+'<div style="font-size:.62rem;color:#9D6050;text-align:center;margin-top:2px;">Parcours</div></div>';
      }
      html += '<div style="background:#FFF3EE;border:2px solid #FC4C02;border-radius:12px;padding:16px;margin-bottom:10px;">'
            + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
            + '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FC4C02"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>'
            + '<div style="font-size:1rem;font-weight:700;color:#FC4C02;flex:1;">'+emoji+' '+escH(act.nom||typeLabel)+'</div>'
            + '</div>'
            + '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">'
            + (routeHtml ? routeHtml : '')
            + '<div style="flex:1;min-width:180px;">'
            + '<div style="display:flex;gap:16px;flex-wrap:wrap;">'+pillsHtml+'</div>'
            + splitsHtml
            + lapsHtml
            + '</div>'
            + '</div>'
            + '</div>';
    });
  }

  return html;
}

// ── Modal programme ──────────────────────────────────
function openProgModal(progId, seanceId){
  document.getElementById('progModalTitle').textContent = 'Programme';
  document.getElementById('progModalBody').innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
  document.getElementById('progModal').classList.add('open');
  var fetches = [
    fetch(SUPA_URL + '/rest/v1/programmes?id=eq.' + progId + '&select=*', {
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); })
  ];
  if(seanceId){
    fetches.push(
      fetch(SUPA_URL + '/rest/v1/athlete_feedback?seance_id=eq.' + seanceId, {
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
      }).then(function(r){ return r.json(); })
    );
  }
  Promise.all(fetches)
  .then(function(results){
    var arr = Array.isArray(results[0]) ? results[0] : [];
    if(!arr.length){ document.getElementById('progModalBody').innerHTML = '<div class="error-state"><div class="error-icon">⚠️</div><div>Programme introuvable.</div></div>'; return; }
    var prog = arr[0];
    document.getElementById('progModalTitle').textContent = prog.nom || 'Programme';
    var raw = prog.donnees || [];
    var blocs = Array.isArray(raw) ? raw : (raw.blocs || []);
    var existing = null;
    if(results[1]){
      var fbArr = Array.isArray(results[1]) ? results[1] : [];
      existing = fbArr.length ? fbArr[0] : null;
    }
    _loadPainRatings();
    _loadSessionNote();
    var donnees = prog.donnees || {};
    var isCap = donnees.type === 'cap' || (prog.nom && prog.nom.indexOf('CAP —') === 0);
    var isHsr = donnees.type === 'hsr' || (prog.nom && prog.nom.indexOf('HSR —') === 0);
    _initExoEffortsFromFeedback(existing && existing.exo_data);
    var html = isCap ? _buildCapProgHTML(prog) : (isHsr ? _buildHsrProgHTML(prog) : buildProgHTML(prog));
    if(seanceId) html += (isCap || isHsr) ? _buildCapPainCard(seanceId, existing) : buildRpeCard(seanceId, _blocsVisibles(blocs), existing);
    document.getElementById('progModalBody').innerHTML = html;
  })
  .catch(function(){
    document.getElementById('progModalBody').innerHTML = '<div class="error-state"><div class="error-icon">⚠️</div><div>Erreur réseau.</div></div>';
  });
}

// ── Dictionnaire méthodes (même source que programme_v2.html) ──


// ── Pain ratings + done state per exercise ────────────────────
var _painRatings = {}; // { 'exoKey': 0-10 }
var _doneExos    = {}; // { 'exoKey': true }

function _exoKey(blocIdx, exoIdx){ return 'b'+blocIdx+'e'+exoIdx; }

function _loadPainRatings(){
  if(!_currentSeanceId) return;
  try {
    var raw = localStorage.getItem('r4p-pain-'+_currentSeanceId);
    _painRatings = raw ? JSON.parse(raw) : {};
    var rawDone = localStorage.getItem('r4p-done-'+_currentSeanceId);
    _doneExos = rawDone ? JSON.parse(rawDone) : {};
  } catch(e){ _painRatings = {}; _doneExos = {}; }
}

function _savePainRatings(){
  if(!_currentSeanceId) return;
  try { localStorage.setItem('r4p-pain-'+_currentSeanceId, JSON.stringify(_painRatings)); } catch(e){}
}

var PAIN_COLORS = ['#27AE60','#2ECC71','#82D03E','#A9CC3E','#F4D03F','#F39C12','#E67E22','#D35400','#E74C3C','#C0392B','#922B21'];

function _updatePainUI(key){
  var v = _painRatings[key];
  var num = document.getElementById('painNum-'+key);
  var sl  = document.getElementById('painSlider-'+key);
  if(v === undefined){
    /* Le tiret distingue l'absence de réponse du zéro : ce sont deux
       informations différentes, et cette distinction compte autant pour la
       lecture clinique que pour le patient. */
    if(num){ num.textContent='–'; num.style.background='#f0f4f8'; num.style.color='#9aa8b8'; }
    if(sl) sl.value = 0;
  } else {
    if(num){ num.textContent=v; num.style.background=PAIN_COLORS[v]; num.style.color=(v===4?'#1a2433':'#fff'); }
    if(sl) sl.value = v;
  }
}

window._setPainSlider = function(key, val){
  _painRatings[key] = parseInt(val);
  _savePainRatings();
  _updatePainUI(key);
};

/* Tap sur la pastille : note 0 (RAS) si vide, efface si renseigné */
window._togglePainZero = function(key){
  if(_painRatings[key] === undefined) _painRatings[key] = 0;
  else delete _painRatings[key];
  _savePainRatings();
  _updatePainUI(key);
};

/* Passage en ECRITURE : le champ prend la place de l'affichage au repos.
   L'affichage se reconstruit a la sortie du champ (voir `_fermerExoNote`) —
   `blur` est le signal naturel de « j'ai fini » sur un telephone, il n'y a pas
   de bouton « valider » a chercher. */
window._toggleExoNote = function(key){
  var area = document.getElementById('exoNoteArea-'+key);
  var disp = document.getElementById('exoNoteDisp-'+key);
  if(!area) return;
  area.classList.add('open');
  if(disp) disp.style.display = 'none';
  var ta = document.getElementById('exoNote-'+key);
  if(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; ta.focus(); }
};

window._fermerExoNote = function(key){
  var area = document.getElementById('exoNoteArea-'+key);
  var disp = document.getElementById('exoNoteDisp-'+key);
  var ta   = document.getElementById('exoNote-'+key);
  if(!area || !disp) return;
  /* Le champ RESTE dans le DOM, seulement masque : c'est lui que relit l'envoi
     du ressenti (`#exoNote-<clé>`). Le detruire perdrait la saisie. */
  area.classList.remove('open');
  disp.style.display = '';
  disp.innerHTML = _noteDispHTML(key, ta ? ta.value : '');
};

/* Curseur de douleur + bouton de remarque.

   Trois ambiguites corrigees, toutes vecues par le patient :

   1. La QUESTION s'affichait en gris clair a droite du curseur, et disparaissait
      des qu'on y touchait — elle s'effacait au moment meme ou l'on repondait.
      Elle est desormais un intitule, au-dessus, qui ne bouge plus.

   2. Un curseur pose a 0 ne se distinguait pas d'une question SANS REPONSE.
      L'etat vide dit maintenant « Non renseigne », jamais « Aucune douleur » :
      la difference compte autant pour la lecture clinique que pour le patient.

   3. Le bouton de remarque etait un emoji nu de 26 px, sans libelle. Il porte
      son texte. */
function _buildPainSliderHTML(key, withNote, initNote){
  var v = _painRatings[key];
  var has = v !== undefined;
  var numBg  = has ? PAIN_COLORS[v] : '#f0f4f8';
  var numCol = has ? (v===4?'#1a2433':'#fff') : '#9aa8b8';
  /* Plus de libelle adaptatif a droite du curseur. Il changeait a chaque cran
     — « Legere », « Moderee », « Importante » — et cette glose mouvante
     encombrait sans rien apporter : la pastille donne deja le chiffre et sa
     couleur, et les deux reperes fixes donnent l'echelle. */
  var h = '<div class="exo-pain-q">Douleur pendant l\'exercice&nbsp;?'
    + '<span class="exo-pain-opt">— facultatif</span></div>'
    + '<div class="exo-pain-slider-row">'
    + '<div class="exo-pain-num" id="painNum-'+key+'" style="background:'+numBg+';color:'+numCol+'" onclick="_togglePainZero(\''+key+'\')" title="Toucher : aucune douleur / effacer">'+(has?v:'–')+'</div>'
    + '<div class="exo-pain-body">'
    + '<input type="range" class="pain-slider" id="painSlider-'+key+'" min="0" max="10" step="1" value="'+(has?v:0)+'" oninput="_setPainSlider(\''+key+'\',this.value)" onchange="_setPainSlider(\''+key+'\',this.value)">'
    + '</div>'
    + '</div>'
    /* Les reperes donnent l'echelle sans qu'on ait a bouger le curseur pour la
       decouvrir — un patient qui n'ose pas toucher ne saurait pas ce que vaut 7.
       Ils sont FIXES : ce sont les bornes, pas un commentaire de la valeur. */
    + '<div class="exo-pain-ancres"><span>0 · aucune</span><span>10 · insupportable</span></div>';
  if(withNote){
    h += '<div id="exoNoteDisp-'+key+'">' + _noteDispHTML(key, initNote) + '</div>';
  }
  return h;
}

/* Affichage au repos de la remarque. Deux etats, jamais un bouton bavard :

   - RIEN d'ecrit : un lien discret. La pastille bordee de 44 px pesait sur
     chaque exercice — dix mouvements, dix boutons. Le rembourrage vertical
     garde la cible tactile a 44 px alors que le lien parait leger.

   - QUELQUE CHOSE d'ecrit : la note ELLE-MEME. « Remarque ajoutee » ne disait
     rien ; les mots de l'athlete disent tout, et il les relit sans rouvrir. */
function _noteDispHTML(key, note){
  var n = (note || '').trim();
  if(!n){
    return '<button class="exo-note-lien" onclick="_toggleExoNote(\''+key+'\')">'
         + '<span class="plus">+</span> Ajouter une remarque</button>';
  }
  return '<div class="exo-note-faite" onclick="_toggleExoNote(\''+key+'\')" '
       + 'role="button" tabindex="0" title="Modifier la remarque">'
       + '<span class="guill">&#8220;</span>'
       + '<span class="txt">'+escH(n)+'</span>'
       + '<span class="modif">modifier</span>'
       + '</div>';
}

window._toggleDone = function(key){
  _doneExos[key] = !_doneExos[key];
  if(!_currentSeanceId){ try{ localStorage.setItem('r4p-done-'+key, _doneExos[key]?'1':''); }catch(e){} }
  else { try{ localStorage.setItem('r4p-done-'+_currentSeanceId, JSON.stringify(_doneExos)); }catch(e){} }
  var btn = document.getElementById('done-'+key);
  if(btn){
    btn.classList.toggle('done', !!_doneExos[key]);
    btn.textContent = _doneExos[key] ? '✓ Terminé' : '✓ Exercice terminé';
  }
};

// ── Construction HTML d'un programme ────────────────
/* Les separateurs d'etape ne sont pas des blocs. Ce filtre doit etre applique
   AU MEME ENDROIT pour l'affichage et pour la collecte du ressenti : les cles
   de feedback sont construites a partir de la POSITION du bloc, et une liste
   filtree d'un cote seulement decale toutes les cles. C'est ce qui attribuait
   les commentaires au mauvais exercice. */
function _blocsVisibles(blocs){
  return (blocs||[]).filter(function(b){
    return !b || (b.type !== 'etape' && b.type !== 'libre');
  });
}

function buildProgHTML(prog){
  var raw = prog.donnees || [];
  var blocs = Array.isArray(raw) ? raw : (raw.blocs || []);
  var notes = Array.isArray(raw) ? '' : (raw.notes || '');
  var html = '';

  html += '<div class="prog-meta">'
       +  '<div class="prog-title">'+escH(prog.nom||'Programme')+'</div>'
       +  '<div class="prog-date">📅 '+escH(fmtDate(prog.date))+'</div>'
       +  '</div>';

  if(!blocs.length){
    html += '<div class="empty-state"><div style="font-size:2rem;margin-bottom:10px">📋</div><div>Ce programme ne contient pas encore d\'exercices.</div></div>';
    return html;
  }

  // Étapes : titre/couleur viennent de la liste `etapes`. Repli sur les champs
  // portés par le bloc pour les séances enregistrées avant cette liste.
  var ETAPE_COLORS_ATH = ['#2563EB','#DC2626','#16A34A','#F59E0B','#0D9488','#7C3AED','#DB2777','#0891B2'];  // MEME ORDRE que ETAPE_COLORS (js/prog-data.js) : sert d'indice de repli
  var _progEtapes = (!Array.isArray(raw) && Array.isArray(raw.etapes)) ? raw.etapes : [];
  function _progEtape(etapeId){
    return _progEtapes.find(function(e){ return e && e.id===etapeId; }) || null;
  }
  function _progEtapeColor(etapeId, b){
    var e = _progEtape(etapeId);
    if(e && e.color) return e.color;
    var order = [];
    blocs.forEach(function(x){ if(x.etapeId && order.indexOf(x.etapeId)<0) order.push(x.etapeId); });
    var idx = order.indexOf(etapeId);
    return ETAPE_COLORS_ATH[(idx<0?0:idx) % ETAPE_COLORS_ATH.length];
  }
  function _progEtapeTitle(etapeId, b){
    var e = _progEtape(etapeId);
    return (e && e.title) || (b && b.etapeTitle) || 'Étape';
  }

  // Les séparateurs d'étape sont des entrées de `blocs` qui portent l'ordre,
  // pas du contenu : le groupement se lit toujours via etapeId, recalculé à
  // l'enregistrement depuis la position.
  // Deux sortes de séparateurs côté praticien : `etape` ouvre une étape,
  // `libre` ouvre une zone qui n'en a pas. Ni l'un ni l'autre n'est un bloc.
  blocs = _blocsVisibles(blocs);

  blocs.forEach(function(b, bIdx){
    var _etapeStart = b.etapeId && (bIdx===0 || blocs[bIdx-1].etapeId !== b.etapeId);
    var _etapeEnd = b.etapeId && (bIdx===blocs.length-1 || blocs[bIdx+1].etapeId !== b.etapeId);
    if(_etapeStart){
      var _ec = _progEtapeColor(b.etapeId, b);
      html += '<div class="etape-group" style="--etape-c:'+_ec+'">'
           +  '<div class="etape-header-ath"><span class="etape-dot" style="background:'+_ec+'"></span>'+escH(_progEtapeTitle(b.etapeId, b))+'</div>';
    }
    // ── AMRAP / EMOM ─────────────────────────────────────────────
    if(b.type === 'amrap' || b.type === 'emom'){
      var estAmrap = b.type === 'amrap';
      var entete = estAmrap
        ? 'AMRAP ' + escH(b.duree || '?') + ' min'
        : 'EMOM ' + escH(b.dureeTotale || '?') + ' min — ' + escH(b.intervalle || '1') + ' min par exercice';
      html += '<div class="bloc bloc-chrono '+(estAmrap?'bloc-amrap':'bloc-emom')+'">'
           +  '<div class="bloc-header"><div class="bloc-title">'+escH(b.title || (estAmrap?'AMRAP':'EMOM'))+'</div>'
           +  '<span class="bloc-badge">'+entete+'</span></div>';
      html += '<div class="exo-list">';
      (b.exos || []).forEach(function(e, i){
        // Vignette video, comme dans un bloc d'exercices : un mouvement se
        // montre. Place reservee sans video, pour garder les noms alignes.
        var _cy = _ytId(e.url||'');
        html += '<div class="exo-item chrono-item">'
             +  (estAmrap ? '' : '<span class="chrono-min-ath">min '+(i+1)+'</span>')
             +  (_cy
                 ? '<span class="chrono-vig" onclick="openYtModal(\''+_cy+'\')" title="Voir la video">'
                   + '<img src="https://img.youtube.com/vi/'+_cy+'/hqdefault.jpg" alt="video" loading="lazy"></span>'
                 : '<span class="chrono-vig no-vid"></span>')
             +  '<span class="chrono-nom-ath">'+escH(e.name || '')+'</span>'
             +  (e.reps ? '<span class="chrono-reps-ath">'+escH(e.reps)+(e.perCote?' <span class="chrono-cote-ath">/ côté</span>':'')+'</span>' : '')
             +  '</div>';
      });
      html += '</div>';
      if(estAmrap){
        var cible = b.toursCible ? ' (objectif ' + escH(b.toursCible) + ')' : '';
        html += '<div class="chrono-saisie">'
             +  '<label for="tours-'+escH(b.id)+'">Tours réalisés'+cible+'</label>'
             +  '<input id="tours-'+escH(b.id)+'" type="number" min="0" inputmode="numeric" '
             +  'value="'+escH(_toursRealises[b.id] || '')+'" '
             +  'oninput="_saveTours(\''+escH(b.id)+'\',this.value)">'
             +  '</div>';
      }
      if(b.commentaire) html += '<div class="texte-corps">'+escH(b.commentaire).replace(/\n/g,'<br>')+'</div>';
      html += '</div>';
      if(_etapeEnd) html += '</div>';
      return;
    }
    // ── Bloc texte ───────────────────────────────────────────────
    if(b.type === 'texte'){
      html += '<div class="bloc bloc-texte"><div class="bloc-header">'
           +  '<div class="bloc-title">'+escH(b.title||'Consigne')+'</div>'
           +  '</div><div class="texte-corps">'+escH(b.contenu||'').replace(/\n/g,'<br>')+'</div></div>';
      if(_etapeEnd) html += '</div>';
      return;
    }
    // ── Bloc cardio ──────────────────────────────────────────────
    if(b.type === 'cardio'){
      /* Seul « course » etait traduit : l'athlete lisait `velo`, `natation`,
         `rameur`, `ski_erg` en cle brute, et toujours sous une icone de
         coureur. Les libelles portent donc desormais leur propre icone, et la
         table couvre TOUS les sports.
         Elle recopie CARDIO_SPORTS de js/prog-data.js — athlete.html est un
         document separe qui ne peut pas l'importer. `qualite/cardio-cas.js`
         echoue si les deux listes divergent. */
      var CARDIO_SPORTS_ATH = {
        marche:   '🚶 Marche',
        course:   '🏃 Course à pied',
        velo:     '🚴 Vélo',
        natation: '🏊 Natation',
        rameur:   '🚣 Rameur',
        ski_erg:  '❄️ Ski Erg'
      };
      /* Repli sur la valeur telle quelle : d'anciennes seances ont pu y ecrire
         un libelle libre, mieux vaut l'afficher que le remplacer par « Cardio ». */
      var sport = CARDIO_SPORTS_ATH[b.sport] || b.sport || 'Cardio';
      var effortLbl = b.effort_type === 'fractionne' ? 'Fractionné' : (b.effort_type === 'continu' ? 'Continu' : '');
      html += '<div class="bloc"><div class="bloc-header">'
           +  '<div class="bloc-title">'+escH(sport)+'</div>'
           +  (effortLbl ? '<span class="bloc-badge endurance">'+escH(effortLbl)+'</span>' : '')
           +  '</div><div class="exo-list"><div class="exo-item">';
      // Détails workout
      var cParams = [];
      if(b.effort_type === 'fractionne'){
        if(b.repetitions) cParams.push({l:'Répétitions', v: b.repetitions+'×'});
        if(b.duree_effort) cParams.push({l:'Course', v: b.duree_effort});
        if(b.duree_recup)  cParams.push({l:'Marche', v: b.duree_recup});
      }
      if(b.duree_totale) cParams.push({l:'Durée totale', v: b.duree_totale+' min'});
      if(b.distance) cParams.push({l:'Distance', v: b.distance+' km'});
      if(b.zone) cParams.push({l:'Zone cardio', v: 'Zone '+b.zone});
      if(cParams.length){
        html += '<div class="exo-params">';
        cParams.forEach(function(p){ html += '<div class="param-box"><div class="param-label">'+escH(p.l)+'</div><div class="param-val">'+escH(p.v)+'</div></div>'; });
        html += '</div>';
      }
      // Deux champs possibles selon l'origine du bloc : "notes" (blocs générés par
      // un protocole CAP) ou "commentaire" (champ "Consignes" saisi manuellement
      // dans le builder) — sans ce fallback, les consignes tapées à la main sur un
      // bloc cardio n'apparaissaient jamais côté athlète.
      var _cardioConsigne = b.notes || b.commentaire;
      if(_cardioConsigne) html += '<div class="exo-consigne">💬 '+escH(_cardioConsigne)+'</div>';
      // Douleur session
      var _cKey = 'cardio-'+bIdx;
      html += _buildPainSliderHTML(_cKey, false, '');
      html += '</div></div></div>';
      if(_etapeEnd) html += '</div>'; // .etape-group
      return;
    }
    // ── Bloc musculation / autre ──────────────────────────────────
    var obj = b.objectif||'libre';
    html += '<div class="bloc">'
         +  '<div class="bloc-header">'
         +  '<div class="bloc-title">'+escH(b.title||'Bloc')+'</div>';
    // « Libre » est la valeur de repli, pas un objectif choisi — et le mot ne
    // dit rien à un patient. Pas de badge tant qu'il n'y a rien à annoncer.
    if(obj !== 'libre'){
      html += '<span class="bloc-badge '+escH(obj)+'">'+escH(OBJ_LABELS[obj]||obj)+'</span>';
    }
    html += '</div>';
    /* Plus de carte de methode. Elle annoncait au patient l objectif, le nom
       de la methode et sa description — au niveau du BLOC, alors que la
       methode ne s applique qu a une SELECTION d exercices : la consigne
       paraissait valoir pour tous. Meme decision que cote praticien : ce qui
       doit etre explique l est par le praticien, dans la consigne de
       l exercice. Le patient voit ses parametres, et eux seuls. */
    // Grouper les exos en chain-groups et solos
    var exos = b.exos||[];
    var groups = [];
    var gi = 0;
    while(gi < exos.length){
      if(exos[gi].chained){
        var gItems = [];
        while(gi < exos.length && (gItems.length===0 || exos[gi-1].chained)){
          gItems.push({exo:exos[gi], idx:gi});
          gi++;
        }
        groups.push({type:'chain', items:gItems});
      } else {
        groups.push({type:'solo', items:[{exo:exos[gi], idx:gi}]});
        gi++;
      }
    }

    function _buildExoRowV3(e, idx, isLastInChain){
      var _eKey = _exoKey(bIdx, idx);
      var ytId = _ytId(e.url||'');
      var r = '<div class="exo-row-v3">';
      // Thumb + nom
      r += '<div class="exo-top-v3">';
      if(ytId){
        r += '<div class="exo-thumb-v3" onclick="openYtModal(\''+ytId+'\')" title="Voir la vidéo">'
           + '<img src="https://img.youtube.com/vi/'+ytId+'/hqdefault.jpg" alt="vidéo" loading="lazy">'
           + '<div class="exo-thumb-overlay-v3"><div class="exo-play-circle"><div class="exo-play-tri"></div></div></div>'
           + '</div>';
      } else {
        r += '<div class="exo-thumb-v3 no-vid"><div class="exo-thumb-overlay-v3"><div class="exo-play-circle"><div class="exo-play-tri"></div></div></div></div>';
      }
      r += '<div class="exo-name-v3">'+escH(e.name)+'</div>';
      r += '</div>';
      // Consigne
      if(e.consigne&&e.consigne.trim()) r += '<div class="exo-consigne-v3">'+escH(e.consigne)+'</div>';
      // Pills
      var pills = [];
      if(e.series) pills.push({l:'Séries', v:e.series, cls:''});
      if(e.reps)   pills.push({l:'Reps', v:e.reps+(e.perCote?' / côté':''), cls:''});
      else if(e.duree) pills.push({l:'Durée', v:e.duree+(e.perCote?' / côté':''), cls:''});
      if(e.reps && e.duree) pills.push({l:'Durée', v:e.duree+(e.perCote?' / côté':''), cls:''});
      if(e.tempo)  pills.push({l:'Tempo', v:e.tempo, cls:''});
      var cibles = e.cibles&&e.cibles.length ? e.cibles : (e.cibleType?[{type:e.cibleType,min:e.cibleVal||'',max:''}]:[]);
      cibles.forEach(function(c,ci){ var cf=fmtCible(c); if(cf) pills.push({l:'Cible'+(cibles.length>1?' '+(ci+1):''), v:cf, cls:''}); });
      // Récup : grisée si mid-chain (pas de pause), sinon valeur réelle
      // Enchaîné : pas de pause, c'est une consigne et elle s'affiche. Récup
      // non renseignée : rien à dire, donc pas de pastille — un tiret encadré
      // occupait autant de place qu'une vraie valeur.
      if(e.chained && !isLastInChain){
        pills.push({l:'Récup', v:'enchaîné', cls:'recup recup-dim'});
      } else if(e.recup){
        pills.push({l:'Récup', v:e.recup, cls:'recup'});
      }
      r += '<div class="exo-pills">';
      pills.forEach(function(p){
        r += '<div class="exo-pill '+p.cls+'">'
           + '<div class="exo-pill-lbl">'+escH(p.l)+'</div>'
           + '<div class="exo-pill-val">'+escH(p.v)+'</div>'
           + '</div>';
      });
      r += '</div>';
      // Douleur (curseur) + note repliée
      var _initNote = _existingExoNotes[_eKey] || '';
      r += _buildPainSliderHTML(_eKey, true, _initNote);
      /* Jamais ouverte au depart, meme avec une note existante : c'est la note
         elle-meme qui s'affiche au repos, pas un champ de saisie. */
      r += '<div class="exo-note-area" id="exoNoteArea-'+_eKey+'">'
         + '<textarea id="exoNote-'+_eKey+'" class="exo-exo-note-inp" placeholder="Remarque sur cet exercice…" rows="1" '
         + 'oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\'" '
         + 'onblur="_fermerExoNote(\''+_eKey+'\')">'+escH(_initNote)+'</textarea>'
         + '</div>';
      r += '</div>';
      return r;
    }

    groups.forEach(function(g){
      if(g.type==='chain'){
        html += '<div class="exo-chain-group">';
        g.items.forEach(function(item, ii){
          html += _buildExoRowV3(item.exo, item.idx, ii===g.items.length-1);
        });
        html += '</div>';
      } else {
        html += '<div class="exo-solo-group">';
        html += _buildExoRowV3(g.items[0].exo, g.items[0].idx, true);
        html += '</div>';
      }
    });
    html += '</div>';
    if(_etapeEnd) html += '</div>'; // .etape-group
  });

  if(notes&&notes.trim()){
    html += '<div class="notes-bloc"><div class="notes-label">📝 Notes & Consignes</div><div class="notes-text">'+escH(notes)+'</div></div>';
  }
  return html;
}

// ── Calcul durée estimée (miroir de programme.html) ──────────────
function _parseNum(str){
  if(!str) return null;
  str = String(str).trim();
  if(str==='Max'||str==='max') return 20;
  if(str.indexOf('+')!==-1){ var p=str.split('+').map(parseFloat).filter(function(n){return !isNaN(n);}); if(p.length) return p.reduce(function(a,b){return a+b;},0); }
  if(str.match(/^\d[\d-]*\d$/)&&str.indexOf('-')!==-1){ var p2=str.split('-').map(parseFloat).filter(function(n){return !isNaN(n);}); if(p2.length>1) return p2.reduce(function(a,b){return a+b;},0)/p2.length; }
  var n=parseFloat(str); return isNaN(n)?null:n;
}
function _parseMin(str){
  if(!str) return null;
  str=String(str).trim().toLowerCase().replace(/\s/g,'');
  var m;
  if(m=str.match(/^(\d+)min(\d+)s?$/)) return parseInt(m[1])+parseInt(m[2])/60;
  if(m=str.match(/^(\d+)min$/)) return parseInt(m[1]);
  if(m=str.match(/^(\d+)s$/)) return parseInt(m[1])/60;
  if(m=str.match(/^([\d.]+)-([\d.]+)min$/)) return (parseFloat(m[1])+parseFloat(m[2]))/2;
  var n=parseFloat(str); return isNaN(n)?null:n;
}
function _estimateExoMin(e){
  var series=_parseNum(e.series); if(!series||series<=0) return null;
  var recup=_parseMin(e.recup); if(recup===null) recup=0;
  var work=0;
  if(e.duree){ var d=_parseMin(e.duree); work=(d!==null)?d:0.5; }
  else if(e.reps){ var r=_parseNum(e.reps); work=r?(r*4)/60:0.5; }
  else work=0.5;
  return series*work+Math.max(0,series-1)*recup;
}
function _calcSessionDuree(blocs){
  var total=0;
  blocs.forEach(function(b){
    if(b.type === 'cardio'){
      total += (b.duree_totale || 0);
    } else {
      (b.exos||[]).forEach(function(e){
        var m=_estimateExoMin(e);
        if(m&&m>0) total+=m;
      });
    }
  });
  return Math.max(5, Math.round(total));
}

  });

function _submitRpe(){
  if(!_currentRpe){ alert('Sélectionne ton niveau d\'effort (1–10).'); return; }
  if(!_currentSeanceId) return;
  var dur = _rpeGetDuree();
  var btn = document.getElementById('rpeSubmitBtn');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Envoi…'; }

  // Collecter le feedback par exercice depuis _currentBlocs
  var exoRows = [];
  (_currentBlocs||[]).forEach(function(b, bi){
    if(b.type === 'cardio'){
      var cKey = 'cardio-'+bi;
      var cPain = (_painRatings[cKey] !== undefined) ? _painRatings[cKey] : null;
      var sport = b.sport || 'Cardio';
      if(cPain !== null) exoRows.push({ key: cKey, name: sport, pain: cPain });
      return;
    }
    (b.exos||[]).forEach(function(e, ei){
      if(!e.name) return;
      var eKey = _exoKey(bi, ei);
      var pain = (_painRatings[eKey] !== undefined) ? _painRatings[eKey] : null;
      var noteInp = document.getElementById('exoNote-'+eKey);
      var note = noteInp ? noteInp.value.trim() : '';
      if(pain !== null || note) {
        var row = { key: eKey, name: e.name };
        if(pain !== null) row.pain = pain;
        if(note) row.note = note;
        exoRows.push(row);
      }
    });
  });
  var globalNote = ((document.getElementById('exoGlobalNoteTA')||{}).value||'').trim();
  var exoData = (exoRows.length || globalNote) ? { exos: exoRows, note: globalNote } : null;

  var body = { seance_id:_currentSeanceId, rpe:_currentRpe, duree_min:dur, submitted_at:new Date().toISOString() };
  if(exoData) body.exo_data = exoData;

  fetch(SUPA_URL+'/rest/v1/athlete_feedback', {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok){ return r.json().then(function(d){ alert('Erreur : '+JSON.stringify(d)); if(btn){btn.disabled=false;btn.textContent='Envoyer mon ressenti';} }); }
    var ua = _currentRpe*dur;
    var card = document.getElementById('rpeCard');
    if(card) card.innerHTML=
      '<div class="rpe-success-msg">'
      +'<div style="font-size:1.4rem;">✅</div>'
      +'<div style="font-weight:700;color:var(--navy);margin:6px 0;">Ressenti enregistré !</div>'
      +'<div class="rpe-success-ua" style="color:'+_uaColor(ua)+';">⚡ '+ua+' UA</div>'
      +'<div class="rpe-success-detail">RPE '+_currentRpe+' × '+dur+' min</div>'
      +'</div>';
  }).catch(function(){ alert('Erreur réseau. Réessaie.'); if(btn){btn.disabled=false;btn.textContent='Envoyer mon ressenti';} });
}

           +  escH(String(bloc.duree_totale))+' min continu</div>';
    } else if(bloc.effort_type === 'continu' && bloc.distance){
      html += '<div style="font-size:1.05rem;font-weight:800;color:#1A3A5C;margin-bottom:4px;">'
           +  escH(String(bloc.distance))+' km continu</div>';
    }
    var cMeta = [];
    if(bloc.duree_totale) cMeta.push('~'+bloc.duree_totale+' min');
    if(bloc.distance && bloc.duree_totale) cMeta.push(bloc.distance+' km');
    if(bloc.zone) cMeta.push('Zone '+bloc.zone);
    if(cMeta.length) html += '<div style="font-size:.75rem;color:#0369A1;font-weight:600;">'+escH(cMeta.join(' · '))+'</div>';
    var _capCardioConsigne = bloc.notes || bloc.commentaire;
    if(_capCardioConsigne) html += '<div style="font-size:.75rem;color:#475569;margin-top:5px;font-style:italic;white-space:pre-wrap;">💬 '+escH(_capCardioConsigne)+'</div>';
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function _buildHsrProgHTML(prog) {
  var d    = prog.donnees || {};
  var ref  = d.ref1RM || 0;
  var charge = ref ? Math.round(ref * (d.pct || 65) / 100 * 2) / 2 : null;
  var sets   = d.sets  || '?';
  var reps   = d.reps  || '?';
  var phase  = d.phase_label || d.phase_key || '';
  var exo    = d.exercice || '';
  var idx    = d.session_index !== undefined ? d.session_index + 1 : '?';
  var total  = d.total || '?';
  var consignes = d.consignes && d.consignes.length ? d.consignes : [
    'Tempo 3/0/3/0 : 3 s excentrique — 0 s pause — 3 s concentrique — 0 s pause',
    'Repos entre les séries : 2 à 3 minutes',
    'Douleur tolérable ≤ 3/10 pendant l\'exercice — arrêter si ≥ 5/10',
    'Progresser uniquement si douleur ≤ 3/10 lors de la dernière série',
    'Échauffement : 5 min vélo léger + 1 série légère à 15 répétitions',
    'Minimum 48 h de récupération entre deux séances'
  ];

  var html = '<div style="padding:6px 0 14px;">';
  html += '<div style="font-size:1.1rem;font-weight:800;color:#14532d;margin-bottom:4px;">🏋 HSR — ' + escH(exo || prog.nom) + '</div>';
  html += '<div style="font-size:.78rem;color:#6b7a8d;margin-bottom:10px;">' + escH(phase) + ' · Séance ' + idx + '/' + total + '</div>';

  if (charge !== null) {
    html += '<div style="background:#f0fdf4;border-radius:8px;padding:10px 12px;margin-bottom:10px;">'
      + '<div style="font-size:.66rem;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Prescription</div>'
      + '<div style="font-size:1.1rem;font-weight:800;color:#14532d;">' + sets + '×' + reps + ' répétitions</div>'
      + '<div style="font-size:.82rem;color:#15803d;font-weight:600;margin-top:2px;">' + charge + ' kg (' + (d.pct || '?') + '% 1RM)</div>'
      + '</div>';
  }

  if (consignes.length) {
    html += '<div style="background:#f0fdf4;border-radius:8px;padding:10px 12px;font-size:.77rem;color:#14532d;">';
    html += '<div style="font-size:.66rem;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;">Consignes</div>';
    consignes.forEach(function(c){ html += '<div style="padding:2px 0;">• ' + escH(c) + '</div>'; });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

var _capCurrentRpe = 0;

function _buildCapPainCard(seanceId, existing) {
  _capCurrentSeanceId = seanceId;
  // Nouvelles colonnes douleur/effort — fallback legacy (rpe=douleur, duree_min=effort<=10)
  _capCurrentPain = (existing && existing.douleur !== null && existing.douleur !== undefined) ? existing.douleur
    : (existing && existing.rpe !== null && existing.rpe !== undefined && existing.duree_min <= 10) ? existing.rpe : null;
  _capCurrentRpe  = (existing && existing.effort) ? existing.effort
    : (existing && existing.duree_min && existing.duree_min <= 10) ? existing.duree_min : 0;

  var alreadyDone = _capCurrentPain !== null;
  var html = '<div class="rpe-card" id="rpeCard">';

  // ── Douleur EVA ──
  html += '<div class="rpe-card-title">🩹 Douleur (EVA)</div>';
  html += '<div class="rpe-scale-label" style="margin-bottom:8px;">0 = aucune · 10 = insupportable</div>';
  if(alreadyDone) html += '<div class="rpe-already">✓ Déjà renseigné : '+_capCurrentPain+'/10 — '+((_capPainDescs[_capCurrentPain])||'')+' — tu peux modifier ton bilan</div>';
  if(alreadyDone && existing && existing.seen_at) html += '<div class="rpe-seen">👁️ Lu par ton kiné le '+_fmtSeenDate(existing.seen_at)+'</div>';
  html += '<div class="rpe-buttons" id="capPainBtns">';
  for(var i=0; i<=10; i++){
    var act = (alreadyDone && _capCurrentPain===i) ? ' active' : '';
    html += '<button class="rpe-btn'+act+'" data-val="'+i+'" style="'+(act?'background:#E74C3C;border-color:#E74C3C;color:#fff;':'')+'" onclick="_capSetPain('+i+')">'+i+'</button>';
  }
  html += '</div>';
  html += '<div class="rpe-desc" id="capPainDesc" style="color:'+(_capCurrentPain!==null?(_capPainColors[_capCurrentPain]||''):'var(--muted)')+'">'+(_capCurrentPain!==null?escH(_capPainDescs[_capCurrentPain]||''):'')+'</div>';

  // ── Effort Borg ──
  html += '<div style="border-top:1px solid #e5e7eb;margin:14px 0 10px;"></div>';
  html += '<div class="rpe-card-title">💪 Effort ressenti (Borg)</div>';
  html += '<div class="rpe-scale-label" style="margin-bottom:8px;">1 = très facile · 10 = maximum</div>';
  html += '<div class="rpe-buttons" id="capRpeBtns">';
  for(var j=1; j<=10; j++){
    var actR = (_capCurrentRpe===j) ? ' active' : '';
    html += '<button class="rpe-btn'+actR+'" data-val="'+j+'" onclick="_capSetRpe('+j+')">'+j+'</button>';
  }
  html += '</div>';
  var initBorg = _capCurrentRpe>0 ? BORG_CR10[_capCurrentRpe] : null;
  html += '<div class="rpe-desc" id="capRpeDesc" style="color:'+(initBorg?initBorg.color:'var(--muted)')+'">'+escH(initBorg?initBorg.label:'')+'</div>';

  html += '<button class="rpe-submit-btn" id="capPainSubmit" onclick="_submitCapFeedback()">'+( alreadyDone?'Mettre à jour mon bilan':'Envoyer mon bilan')+'</button>';
  html += '</div>';
  return html;
}

function _capSetPain(val) {
  _capCurrentPain = val;
  document.querySelectorAll('#capPainBtns .rpe-btn').forEach(function(b){
    var on = parseInt(b.dataset.val)===val;
    b.classList.toggle('active', on);
    b.style.background = on ? '#E74C3C' : '';
    b.style.borderColor = on ? '#E74C3C' : '';
    b.style.color = on ? '#fff' : '';
  });
  var desc = document.getElementById('capPainDesc');
  if(desc){ desc.textContent = _capPainDescs[val]||''; desc.style.color = _capPainColors[val]||'#6b7a8d'; }
}

function _capSetRpe(val) {
  _capCurrentRpe = val;
  document.querySelectorAll('#capRpeBtns .rpe-btn').forEach(function(b){
    var on = parseInt(b.dataset.val)===val;
    b.classList.toggle('active', on);
    b.style.background = on ? '#2B5FA6' : '';
    b.style.borderColor = on ? '#2B5FA6' : '';
    b.style.color = on ? '#fff' : '';
  });
  var borg = BORG_CR10[val];
  var desc = document.getElementById('capRpeDesc');
  if(desc){ desc.textContent = borg?borg.label:''; desc.style.color = borg?borg.color:''; }
}

function _submitCapFeedback() {
  if(_capCurrentPain===null||_capCurrentPain===undefined){ alert('Sélectionne ton score de douleur (0–10).'); return; }
  if(!_capCurrentRpe){ alert('Sélectionne ton niveau d\'effort (1–10).'); return; }
  if(!_capCurrentSeanceId) return;
  var btn = document.getElementById('capPainSubmit');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Envoi…'; }

  fetch(SUPA_URL+'/rest/v1/athlete_feedback', {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    // douleur/effort dans leurs colonnes dediees — rpe/duree_min mis a NULL
    // (reserves aux seances standard : rpe = Borg, duree_min = duree reelle)
    body: JSON.stringify({ seance_id: _capCurrentSeanceId, douleur: _capCurrentPain, effort: _capCurrentRpe, rpe: null, duree_min: null, submitted_at: new Date().toISOString() })
  })
  .then(function(r){
    if(!r.ok){ return r.json().then(function(d){ alert('Erreur : '+JSON.stringify(d)); if(btn){btn.disabled=false;btn.textContent='Réessayer';} }); }
    // Re-rendre la carte interactive (avec le nouveau statut "déjà renseigné") plutôt que
    // de la figer — l'athlète doit pouvoir corriger son bilan sans recharger la page.
    var card = document.getElementById('rpeCard');
    if(card){
      card.outerHTML = _buildCapPainCard(_capCurrentSeanceId, { douleur: _capCurrentPain, effort: _capCurrentRpe, seen_at: null });
      var freshBtn = document.getElementById('capPainSubmit');
      if(freshBtn){
        var savedLabel = freshBtn.textContent;
        freshBtn.textContent = '✓ Enregistré';
        setTimeout(function(){ if(freshBtn) freshBtn.textContent = savedLabel; }, 1800);
      }
    }
  })
  .catch(function(){ alert('Erreur réseau. Réessaie.'); if(btn){btn.disabled=false;btn.textContent='Réessayer';} });
}
// ─────────────────────────────────────────────────────────────────────────────
</script>
