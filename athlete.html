<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Mon Programme</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
/* Manifest créé en JS (pas de <link> statique dans le HTML) : un <link rel="manifest">
   présent dès le parsing serait préfetché par le navigateur avant que ce script ait pu
   le corriger, et certaines versions de Safari/iOS liraient alors la version sans
   token. En créant l'élément nous-mêmes, il n'existe qu'une seule version possible.
   Avec token → start_url = l'URL complète en cours, pour que « Ajouter à l'écran
   d'accueil » mémorise le lien personnel de l'athlète (l'app installée rouvre son
   calendrier sans dépendre du localStorage, isolé de Safari en mode standalone iOS). */
(function(){
  try {
    var p = new URLSearchParams(window.location.search);
    var hasToken = !!(p.get('patient') || p.get('prog'));
    var link = document.createElement('link');
    link.rel = 'manifest';
    if(hasToken){
      var m = {
        name:"Rehab4Perf — Mon programme", short_name:"Rehab4Perf",
        description:"Votre calendrier de séances et vos exercices, suivis par votre praticien.",
        start_url: window.location.href, scope:"/athlete.html",
        display:"standalone", orientation:"portrait", lang:"fr",
        background_color:"#1A3A5C", theme_color:"#1A3A5C",
        icons:[
          {src:"/icons/athlete-192.png",sizes:"192x192",type:"image/png",purpose:"any"},
          {src:"/icons/athlete-512.png",sizes:"512x512",type:"image/png",purpose:"any"},
          {src:"/icons/athlete-512-maskable.png",sizes:"512x512",type:"image/png",purpose:"maskable"}
        ]
      };
      var blob = new Blob([JSON.stringify(m)], {type:"application/manifest+json"});
      link.href = URL.createObjectURL(blob);
    } else {
      link.href = 'manifest-athlete.webmanifest';
    }
    document.head.appendChild(link);
  } catch(e){}
})();
</script>
<meta name="theme-color" content="#1A3A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehab4Perf">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --navy:#1A3A5C; --accent:#2B5FA6; --accent2:#4A90D9;
  --bg:#F0F4F8; --surface:#fff; --text:#1a2433; --muted:#6b7a8d;
  --border:#dde3ec;
  /* La page chargeait fonts.css sans jamais utiliser Figtree : le patient
     voyait une autre typographie que le praticien, sur le même produit. */
  --font-sans:'Figtree', -apple-system, 'Helvetica Neue', sans-serif;
  /* ── Échelle typographique ────────────────────────────────────────
     Neuf pas, et pas un de plus. Ce fichier en comptait des dizaines,
     avec des voisines indiscernables (.64 / .65 / .66 / .67 / .68) : ce
     ne sont plus des décisions, c'est de la dérive, et c'est ce qui fait
     qu'une interface paraît « presque juste » sans qu'on sache dire
     pourquoi. `node qualite/check-echelle.js` empêche d'en rajouter.
     Base 16 px — ne pas recopier ces valeurs dans outils.html, dont la
     racine est à 14 px. */
  --fs-2xs:.625rem;  --fs-xs:.6875rem; --fs-sm:.75rem;
  --fs-md:.8125rem;  --fs-lg:.875rem;  --fs-xl:1rem;
  --fs-2xl:1.25rem;  --fs-3xl:1.5rem;  --fs-4xl:2rem;
  /* Types de bloc, mêmes teintes que côté praticien : la pastille porte le
     type, le filet reste à l'étape. */
  --amrap:#B45309;  --amrap-l:#FDF0E1;
  --emom:#6D28D9;   --emom-l:#F1EAFE;
  --bloc-texte:#475569; --bloc-texte-l:#EEF1F5;
  /* Niveaux secondaires, dans la meme famille froide que --text. */
  --text-dk:#374151; --text2:#546578; --text3:#9AA8B8; --border2:#C6D0DE;
  /* ── Couleurs porteuses d'information ──────────────────────────────
     Objectifs de bloc, echelle de douleur, marque : jamais fondues, jamais
     anonymes. Memes valeurs que cote praticien pour les objectifs. */
  --obj-endurance:#075985;    --obj-endurance-l:#E0F2FE;
  --obj-endurance-d:#1A4D28;  --obj-endurance-b:#2D7D46;  --obj-endurance-xl:#F0FAF0;
  --obj-puissance:#9A3412;    --obj-puissance-l:#FFEDD5;
  --obj-puissance-t:#7B2DBF;  --obj-puissance-td:#4A1D8A; --obj-puissance-tl:#F5F0FF;
  --obj-hypertrophie:#5B21B6; --obj-hypertrophie-l:#EDE9FE; --obj-hypertrophie-d:#1A3A6E;
  --obj-forcemax:#C0392B;     --obj-forcemax-d:#7A1A10;   --obj-forcemax-l:#FEF0EE;
  --etape-defaut:#F59E0B;
  --douleur-0:#27AE60; --douleur-1:#82D03E; --douleur-2:#F4D03F; --douleur-3:#F39C12;
  --douleur-4:#E67E22; --douleur-5:#E74C3C; --douleur-6:#922B21;
  --curseur:#94A3B8;
  --tag-chain:#5B4FBF; --tag-chain-l:#F3F0FF; --tag-exo-l:#EBF3FF;
  --note:#4338CA; --note-b:#C7D2FE; --note-l:#EEF2FF;
  --suivi:#0F766E; --rpe-h:#1A4D8A; --logo-e:#7FA8D9;
  --focus:#4A90D9;
  /* ── États ─────────────────────────────────────────────────────────
     Mêmes noms et mêmes valeurs que dans programme.html : un vert de
     réussite doit être le même vert des deux côtés du produit. */
  --ok:#16A34A;     --ok-d:#15803D;     --ok-b:#86EFAC;     --ok-l:#DCFCE7;     --ok-xl:#F0FDF4;
  --warn:#D97706;   --warn-d:#92400E;   --warn-b:#FCD34D;   --warn-l:#FEF3C7;   --warn-xl:#FFFBEB;
  --alerte:#DC2626; --alerte-d:#991B1B; --alerte-b:#FCA5A5; --alerte-l:#FEE2E2; --alerte-xl:#FEF2F2;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); font-family:var(--font-sans); color:var(--text); min-height:100%; }

/* ── HEADER ── */
.app-header {
  background:var(--navy); color:#fff; padding:14px 16px;
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px;
}
.header-logo { display:inline-flex; align-items:center; gap:8px; }
.header-logo svg { display:block; flex-shrink:0; }
.logo-w { display:inline-flex; align-items:baseline; line-height:1; white-space:nowrap; }
.logo-r { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:20px; color:#fff; letter-spacing:-.01em; }
.logo-e { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:.44em; vertical-align:super; color:var(--logo-e); margin:0 .05em 0 .01em; line-height:0; }
.logo-p { font-family:'Poppins',sans-serif; font-weight:800; font-size:16px; color:#fff; letter-spacing:-.025em; margin-left:.02em; }
.header-sub { font-size:var(--fs-xs); color:rgba(255,255,255,.6); margin-top:1px; }
.header-patient { font-size:.95rem; font-weight:700; color:#fff; margin-top:2px; line-height:1.2; }
.header-left { flex:1; min-width:0; }
.header-btn {
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  color:#fff; border-radius:8px; padding:6px 12px; font-size:var(--fs-sm); cursor:pointer;
  white-space:nowrap; transition:background .15s;
}
.header-btn:hover { background:rgba(255,255,255,.25); }
.header-btn:disabled { opacity:.5; cursor:default; }
.back-btn {
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
  color:#fff; border-radius:8px; padding:6px 12px; font-size:var(--fs-sm); cursor:pointer;
  display:none; align-items:center; gap:6px;
}
.back-btn.visible { display:flex; }

/* ── CONTENT ── */
.content { max-width:1100px; margin:0 auto; padding:16px 24px 40px; }

/* ── PROG META ── */
.prog-meta {
  background:var(--surface); border-radius:12px; padding:14px 16px;
  border:1px solid var(--border); margin-bottom:16px;
}
.prog-title { font-size:1.1rem; font-weight:700; color:var(--navy); margin-bottom:3px; }
.prog-date { font-size:var(--fs-sm); color:var(--muted); }

/* ── BLOC ── */
.bloc {
  background:var(--surface); border-radius:12px;
  border:1px solid var(--border); margin-bottom:14px; overflow:hidden;
}
/* En-tête clair, filet à la couleur de l'étape. Le bandeau navy pleine largeur
   pesait plus que le contenu sur un bloc à un seul exercice, et se disputait le
   premier plan avec l'anneau de l'étape : trois couleurs porteuses dans une même
   carte. Il n'en reste qu'une, celle de l'étape. Hors étape, un gris neutre. */
.bloc-header {
  padding:10px 13px 10px 12px; background:var(--surface);
  border-bottom:1px solid var(--border);
  border-left:3px solid var(--etape-c,var(--curseur));
  display:flex; align-items:center; gap:10px;
}
.bloc-title { color:var(--text); font-size:var(--fs-lg); font-weight:700; flex:1; }
.bloc-badge {
  font-size:var(--fs-2xs); font-weight:700; padding:3px 8px; border-radius:10px;
  background:var(--bg); color:var(--text2); text-transform:uppercase; letter-spacing:.04em;
}
.bloc-badge.endurance    { background:var(--obj-endurance-l); color:var(--obj-endurance); }
.bloc-badge.puissance    { background:var(--obj-puissance-l); color:var(--obj-puissance); }
.bloc-badge.hypertrophie { background:var(--obj-hypertrophie-l); color:var(--obj-hypertrophie); }
.bloc-badge.forcemax     { background:#FEE2E2; color:#991B1B; }

/* ── ÉTAPE (groupe de blocs, ex: Échauffement) ── */
.etape-group {
  border:1.5px solid var(--etape-c,var(--etape-defaut)); border-radius:14px;
  padding:10px; margin-bottom:16px; background:rgba(0,0,0,.015);
}
.etape-header-ath {
  display:flex; align-items:center; gap:8px;
  font-size:var(--fs-sm); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--etape-c,var(--etape-defaut)); padding:2px 4px 10px;
}
.etape-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--etape-c,var(--etape-defaut)); }
.etape-group .bloc:last-child { margin-bottom:0; }


.exo-list { padding:6px 0; }
.exo-item { padding:11px 14px; border-bottom:1px solid var(--border); }
.exo-item:last-child { border-bottom:none; }
.exo-item.chained { border-left:3px solid var(--accent2); }
.exo-name { font-size:var(--fs-lg); font-weight:600; color:var(--text); margin-bottom:5px; }
.exo-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
.exo-tag {
  font-size:var(--fs-xs); padding:3px 8px; border-radius:10px;
  background:var(--tag-exo-l); color:var(--accent); font-weight:500; text-decoration:none;
}
.exo-tag.video { background:var(--ok-l); color:var(--ok-d); }
.exo-tag.chain { background:var(--tag-chain-l); color:var(--tag-chain); }
/* ── YouTube vignette ── */
.yt-thumb-wrap {
  display:inline-block; position:relative; cursor:pointer; border-radius:5px;
  overflow:hidden; vertical-align:middle; flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.yt-thumb-wrap img { display:block; width:72px; height:40px; object-fit:cover; }
.yt-thumb-wrap .yt-play {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.28); transition:background .15s;
}
.yt-thumb-wrap:hover .yt-play, .yt-thumb-wrap:active .yt-play { background:rgba(0,0,0,.48); }
.yt-thumb-wrap .yt-play::after {
  content:''; width:0; height:0;
  border-top:7px solid transparent; border-bottom:7px solid transparent;
  border-left:12px solid #fff; margin-left:2px;
}
.yt-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9500;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.yt-modal-overlay.open { display:flex; }
.yt-modal-box {
  background:#000; border-radius:10px; overflow:hidden;
  width:100%; max-width:720px; aspect-ratio:16/9; position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.yt-modal-box iframe { width:100%; height:100%; border:none; display:block; }
.yt-modal-close {
  position:absolute; top:-38px; right:0; background:none; border:none;
  color:#fff; font-size:1.6rem; cursor:pointer; line-height:1; opacity:.8;
}
.yt-modal-close:hover { opacity:1; }
.exo-params {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(85px, 1fr)); gap:5px;
}
.param-box { background:var(--bg); border-radius:8px; padding:6px 8px; text-align:center; }
.param-label { font-size:var(--fs-2xs); color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
.param-val { font-size:var(--fs-lg); font-weight:700; color:var(--text); }
/* `pre-wrap` et non `normal` : la consigne est saisie dans un textarea, ses
   sauts de ligne sont donc de vrais « \n » que le HTML replie en espaces. Le
   praticien ecrit une liste, l'athlete lisait un seul paragraphe. L'export
   imprimable et le detail de protocole les respectaient deja, chacun a sa
   maniere — l'espace athlete etait le seul a les perdre, c'est-a-dire le seul
   endroit ou la consigne sert vraiment. */
.exo-consigne {
  margin-top:7px; font-size:var(--fs-sm); color:var(--muted);
  background:var(--warn-xl); border-left:3px solid var(--warn);
  padding:6px 10px; border-radius:0 6px 6px 0; line-height:1.5;
  white-space:pre-wrap;
}
.chain-link { text-align:center; font-size:var(--fs-xs); color:var(--accent2); padding:3px 0; font-weight:600; }

/* Pain slider per exercise */
.exo-pain-slider-row { display:flex; align-items:center; gap:9px; margin-top:9px; max-width:340px; }
.exo-pain-num {
  width:26px; height:26px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-sm); font-weight:700; background:var(--bg); color:#9aa8b8;
  transition:background .15s, color .15s; cursor:pointer; user-select:none;
}
.exo-pain-body { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
.pain-slider {
  -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:2px;
  outline:none; margin:0; display:block;
  background:linear-gradient(to right,var(--douleur-0) 0%,var(--douleur-1) 20%,var(--douleur-2) 40%,var(--douleur-3) 55%,var(--douleur-4) 70%,var(--douleur-5) 85%,var(--douleur-6) 100%);
  opacity:.75;
}
.pain-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:#fff; border:1.5px solid var(--curseur); cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.pain-slider::-moz-range-thumb {
  width:14px; height:14px; border-radius:50%; background:#fff; border:1.5px solid var(--curseur);
  cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.15);
}
/* La question ne s'efface plus : elle est un intitulé, au-dessus du curseur.
   Auparavant elle vivait à DROITE du curseur, en gris clair, et disparaissait
   au premier contact — elle s'effaçait au moment même où l'on y répondait. */
.exo-pain-q {
  font-size:var(--fs-xs); font-weight:700; color:var(--text2);
  margin:11px 0 5px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;
}
.exo-pain-opt { font-weight:500; color:var(--text3); }

/* Les repères donnent l'échelle sans qu'on ait à bouger le curseur pour la
   découvrir — un patient qui n'ose pas y toucher ne saurait pas ce que vaut 7.

   Ils doivent tomber sous les EXTRÉMITÉS DU CURSEUR, pas sous la ligne entière.
   À gauche, 35 px : la pastille (26 px) et son écart (9 px). À droite, plus
   rien à réserver depuis que le libellé adaptatif a disparu — il occupait
   90 px et décalait d'autant le repère « 10 ».

   Les deux largeurs sont liées : `.exo-pain-slider-row` et cette ligne
   partagent le même `max-width`. Changer l'un sans l'autre désaligne. */
.exo-pain-ancres {
  display:flex; justify-content:space-between;
  font-size:var(--fs-2xs); color:var(--text3);
  margin-top:5px; max-width:340px;
  padding-left:35px;
}

/* Bouton de remarque : c'était un emoji nu de 26 px, sans libellé — rien ne
   disait qu'il ouvrait un champ de texte. Il porte son texte, et sa cible
   tactile passe de 26 px à toute la largeur du libellé. */
/* Lien de remarque — état vide.
   La pastille bordée pesait sur chaque exercice : dix mouvements, dix boutons
   de 44 px. Le lien paraît léger, mais son rembourrage VERTICAL garde la cible
   tactile à 44 px — c'est un doigt de patient qui le vise, pas une souris. */
.exo-note-lien {
  display:inline-flex; align-items:center; gap:5px;
  background:none; border:0; color:var(--accent);
  font-family:inherit; font-size:var(--fs-xs); font-weight:600;
  cursor:pointer; padding:0 2px; margin-top:-2px;
  /* Hauteur FIXEE plutot qu'un rembourrage calcule : un padding qui « tombe
     juste » aujourd'hui derive a la premiere variation de police. */
  min-height:44px;
}
.exo-note-lien .plus { font-size:.95rem; line-height:0; font-weight:400; }

/* Remarque écrite — elle remplace le bouton.
   « Remarque ajoutée » ne disait rien ; les mots de l'athlète disent tout, et
   il les relit sans avoir à rouvrir quoi que ce soit. */
.exo-note-faite {
  display:flex; gap:7px; align-items:flex-start;
  background:var(--bg); border-radius:8px;
  padding:9px 11px; margin-top:9px; cursor:pointer;
}
.exo-note-faite .guill { color:var(--accent2); font-weight:700; flex-shrink:0; line-height:1; }
.exo-note-faite .txt {
  flex:1; min-width:0; font-size:var(--fs-xs); color:var(--text2);
  line-height:1.45; font-style:italic; white-space:pre-wrap; word-break:break-word;
}
.exo-note-faite .modif { flex-shrink:0; color:var(--text3); font-size:var(--fs-2xs); font-weight:700; }
.exo-note-area { display:none; margin-top:6px; }
.exo-note-area.open { display:block; }

/* Session note */
.session-note-section { background:var(--surface); border-radius:12px; border:1px solid var(--border); padding:14px 16px; margin-top:14px; }
.session-note-title { font-size:var(--fs-md); font-weight:700; color:var(--navy); margin-bottom:8px; }
.session-note-ta {
  width:100%; border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; font-size:var(--fs-lg); font-family:inherit; color:var(--text);
  resize:none; min-height:90px; outline:none; line-height:1.5;
}
.session-note-ta:focus { border-color:var(--accent2); }
.session-note-save-btn {
  margin-top:8px; background:var(--accent); color:#fff; border:none;
  border-radius:8px; padding:8px 18px; font-size:var(--fs-md); font-weight:600;
  cursor:pointer; width:100%;
}
.session-note-save-btn:hover { background:var(--accent2); }
.session-note-saved { font-size:var(--fs-sm); color:var(--ok); margin-top:5px; text-align:center; display:none; }

/* Patient persistent note */

.notes-bloc {
  background:var(--surface); border-radius:12px; border:1px solid var(--border);
  padding:14px; margin-bottom:14px;
}
.notes-label { font-size:var(--fs-xs); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; }
.notes-text { font-size:var(--fs-md); color:var(--text); line-height:1.6; white-space:pre-wrap; }

/* ── CALENDAR ── */
.cal-nav {
  display:flex; align-items:center; gap:8px; margin-bottom:14px;
  background:var(--surface); border-radius:12px; border:1px solid var(--border);
  padding:10px 14px; flex-wrap:wrap;
}
.cal-nav h2 { flex:1; text-align:center; font-size:.92rem; font-weight:700; color:var(--navy); text-transform:capitalize; min-width:120px; }
.cal-nav-btn {
  background:none; border:1px solid var(--border); border-radius:8px;
  width:32px; height:32px; cursor:pointer; font-size:var(--fs-lg); color:var(--text);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cal-nav-btn:hover { background:var(--bg); }
.cal-today-btn {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:5px 10px; font-size:var(--fs-sm); cursor:pointer; color:var(--text); flex-shrink:0;
}
/* Vue toggle mois/semaine */
.view-toggle {
  display:flex; gap:2px; background:var(--bg); border-radius:8px; padding:3px; flex-shrink:0;
}
.view-btn {
  padding:4px 10px; border:none; border-radius:6px; font-size:var(--fs-sm);
  cursor:pointer; color:var(--muted); background:transparent;
  transition:all .15s; font-family:inherit; white-space:nowrap;
}
.view-btn.active {
  background:#fff; color:var(--accent); font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.view-btn:hover:not(.active) { color:var(--text); }

.cal-grid {

/* ── Socle commun ──────────────────────────────────────────────────────
   Trois règles qui valent pour toute l'application, posées en fin de
   feuille pour passer devant les déclarations locales.

   1. Chiffres à chasse fixe. Sans ça, une valeur qui change fait sauter
      toute la colonne : « 11 » n'a pas la largeur de « 18 ».
   2. Anneau de focus clavier. Il y a des dizaines d'`outline:none` dans
      ce fichier, tous plus spécifiques que cette règle — le !important
      est ici le seul moyen d'assurer une base commune sans reprendre
      chaque déclaration une à une. Sur un bouton, `:focus-visible` ne se
      déclenche qu'au clavier ; sur un champ de texte il se déclenche aussi
      au clic, la spécification considérant qu'on va y taper — d'où l'anneau
      plus fin et sans décalage sur les champs.
   3. Mouvement réduit, pour qui l'a demandé au niveau du système.
   ────────────────────────────────────────────────────────────────────── */
input[type="number"], table, time,
.tabnum { font-variant-numeric:tabular-nums; }

:focus-visible {
  outline:2px solid var(--focus,#4A90D9) !important;
  outline-offset:2px;
}
/* Pas d'anneau sur les champs de saisie. `:focus-visible` s'y declenche aussi
   a la souris — la specification considere qu'on va y taper — et l'anneau
   apparaissait donc a chaque clic, par-dessus le style de focus que ces champs
   ont deja (fond teinte, bordure d'accent). Deux marques pour une seule
   information, dont une en trop.
   L'anneau reste sur tout le reste — boutons, liens, onglets, controles sur
   mesure — ou rien d'autre ne signale ou l'on se trouve au clavier. */
input:focus-visible, textarea:focus-visible, select:focus-visible,
[contenteditable]:focus-visible {
  outline:none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

var CYCLE_COLORS = {'Force':'#1A3A5C','Puissance':'#C0392B','Hypertrophie':'#2D7D46','Endurance de force':'#2B5FA6','Récupération':'#D4600A','Réathlétisation':'#9B2C6B'};
function _cycleColor(nom){ return CYCLE_COLORS[nom] || '#52514E'; }
function _cyEndDate(cy){
  if(cy.mode === 'criteres'){
    if(cy.endDate){ var ec=new Date(cy.endDate); ec.setHours(0,0,0,0); return ec; }
    // Pas de fin planifiée : si terminé, on fige sur la dernière validation ;
    // sinon le cycle reste "ouvert" jusqu'à aujourd'hui.
    var phases = _cyclePhases(cy);
    var allDone = phases.length>0 && phases.every(_cyclePhaseIsDone);
    if(allDone){
      var latest = null;
      phases.forEach(function(ph){
        (ph.criteria||[]).forEach(function(_,i){
          var at = ph.checks && ph.checks[i] && ph.checks[i].checkedAt;
          if(at){ var d=new Date(at); d.setHours(0,0,0,0); if(!latest||d>latest) latest=d; }
        });
      });
      if(latest) return latest;
    }
    var t=new Date(); t.setHours(0,0,0,0); return t;
  }
  if(cy.endDate){ var e=new Date(cy.endDate); e.setHours(0,0,0,0); return e; }
  var e=new Date(cy.startDate); e.setHours(0,0,0,0); e.setDate(e.getDate()+cy.duree*7-1); return e;
}
/* Cycles « critères » : pas de date de fin connue, terminé quand tous les
   critères sont validés par le praticien. Le suivant démarre alors seul. */
/* Un cycle critères contient des phases ; valider tous les critères d'une
   phase fait passer à la suivante. Rétrocompat : une liste de critères à plat
   est lue comme un cycle à une seule phase. */
function _cyclePhases(c){
  if(c.mode !== 'criteres') return [];
  if(Array.isArray(c.phases) && c.phases.length) return c.phases;
  if(Array.isArray(c.criteria) && c.criteria.length){
    return [{ id:'p0', nom:'', criteria:c.criteria, checks:c.checks||{} }];
  }
  return [];
}
function _cyclePhaseIsDone(ph){
  var items = (ph && ph.criteria) || [];
  if(!items.length) return false;
  return items.every(function(_, i){ return ph.checks && ph.checks[i] && ph.checks[i].checked; });
}
function _cyclePhaseCurrentIndex(c){
  var phases = _cyclePhases(c);
  for(var i=0;i<phases.length;i++){ if(!_cyclePhaseIsDone(phases[i])) return i; }
  return -1;
}
function _cycleIsDone(c, today){
  if(c.mode === 'criteres'){
    var phases = _cyclePhases(c);
    if(!phases.length) return false;
    return phases.every(_cyclePhaseIsDone);
  }
  if(!c.startDate) return false;
  var e = _cyEndDate(c);
  return today > e;
}
/* DEUX VOIES INDEPENDANTES, et non une file d'attente.
   Un cycle a CRITERES n'a pas de date : il dure tant qu'il n'est pas valide.
   Un cycle DATE vit sa fenetre de calendrier. Ce sont deux natures, pas deux
   etapes — le tendon se poursuit sur criteres pendant que le bloc de force
   tourne sur ses dates, et les deux sont vrais en meme temps.

   Chaque voie garde son ordre interne : un cycle a criteres attend que le
   precedent A CRITERES soit valide. Ce qui a saute, c'est le blocage CROISE —
   un cycle date ne retient plus un cycle criteres, et l'inverse non plus.

   Ce que l'on accepte en echange, et qui etait la raison de la regle
   precedente : un cycle date peut desormais s'afficher « en cours » alors
   qu'un cycle criteres place avant lui n'est pas termine. C'est exactement ce
   qu'on veut voir. */
function _cycleIsCurrent(cycles, idx, today){
  var c = cycles[idx];
  if(c.mode === 'criteres'){
    if(_cycleIsDone(c, today)) return false;
    for(var i=0;i<idx;i++){
      if(cycles[i].mode !== 'criteres') continue;   // l'autre voie ne bloque pas
      if(!_cycleIsDone(cycles[i], today)) return false;
    }
    return true;
  }
  if(!c.startDate) return false;
  var s = new Date(c.startDate); s.setHours(0,0,0,0);
  var e = _cyEndDate(c);
  return today >= s && today <= e;
}
function _dayCycleBg(cellDate){
  for(var i=0;i<_calCycles.length;i++){
    var cy=_calCycles[i];
    if(!cy.startDate) continue;
    var cyStart=new Date(cy.startDate); cyStart.setHours(0,0,0,0);
    var cyEnd=_cyEndDate(cy);
    if(cellDate>=cyStart && cellDate<=cyEnd){
      var hex=cy.color||_cycleColor(cy.nom);
      var r=parseInt(hex.slice(1,3),16)||82;
      var g=parseInt(hex.slice(3,5),16)||81;
      var b=parseInt(hex.slice(5,7),16)||78;
      return 'rgba('+r+','+g+','+b+',.10)';
    }
  }
  return '';
}

function _getMonday(d){
  var dt = new Date(d); dt.setHours(0,0,0,0);
  var day = dt.getDay();
  var diff = (day === 0) ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return dt;
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Strava : mêmes helpers que le builder praticien (prog-main.js) ── */
function _fmtPace(secPerKm){
  if(!secPerKm || !isFinite(secPerKm)) return null;
  var m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  if(s === 60){ m++; s = 0; }
  return m + "'" + String(s).padStart(2,'0');
}
function _decodePolyline(str){
  var pts=[], index=0, lat=0, lng=0;
  while(index < str.length){
    var b, shift=0, result=0;
    do { b = str.charCodeAt(index++)-63; result |= (b & 0x1f) << shift; shift += 5; } while(b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift=0; result=0;
    do { b = str.charCodeAt(index++)-63; result |= (b & 0x1f) << shift; shift += 5; } while(b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    pts.push([lat/1e5, lng/1e5]);
  }
  return pts;
}
function _polylineToSvg(encoded, w, h){
  try {
    var pts = _decodePolyline(encoded);
    if(pts.length < 2) return '';
    var minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
    pts.forEach(function(p){
      if(p[0]<minLat)minLat=p[0]; if(p[0]>maxLat)maxLat=p[0];
      if(p[1]<minLng)minLng=p[1]; if(p[1]>maxLng)maxLng=p[1];
    });
    var latR = Math.max(maxLat-minLat, 1e-6), lngR = Math.max(maxLng-minLng, 1e-6);
    var lngScale = Math.cos((minLat+maxLat)/2 * Math.PI/180);
    var effW = lngR * lngScale, effH = latR;
    var scale = Math.min((w-12)/effW, (h-12)/effH);
    var offX = (w - effW*scale)/2, offY = (h - effH*scale)/2;
    var step = Math.max(1, Math.floor(pts.length/160));
    var d = '';
    for(var i=0; i<pts.length; i+=step){
      var x = offX + (pts[i][1]-minLng)*lngScale*scale;
      var y = offY + (maxLat-pts[i][0])*scale;
      d += (d?' L ':'M ') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    var first = pts[0], sx = offX+(first[1]-minLng)*lngScale*scale, sy = offY+(maxLat-first[0])*scale;
    return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'
      + '<path d="'+d+'" fill="none" stroke="#FC4C02" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>'
      + '<circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="4" fill="#22c55e"/>'
      + '</svg>';
  } catch(e){ return ''; }
}

function fmtDate(d){
  if(!d) return '';
  var p = d.split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d;
}

function fmtCible(c){
  if(!c) return '';
  var t=c.type||'RPE', mn=c.min||'', mx=c.max||'';
  if(mn&&mx) return t+' '+mn+'–'+mx;
  if(mn) return t+' '+mn;
  if(!mn&&!mx) return ''; // type seul sans valeur → ne rien afficher
  return t;
}

// ── Init ────────────────────────────────────────────
function init(){
  var params = new URLSearchParams(window.location.search);
  _progId    = params.get('prog')    || '';
  _patientId = params.get('patient') || '';
  _seanceId  = params.get('seance')  || '';
  _kineMode  = params.get('mode') === 'kine';
  _pratId    = params.get('prat')    || '';
  var nomParam = (params.get('nom') || '').trim();

  // Persistance d'identité pour l'app installée (PWA) : lancée depuis l'écran d'accueil,
  // athlete.html s'ouvre SANS les paramètres du lien → on les mémorise à la 1re ouverture
  // (via le lien) puis on les restaure quand l'URL n'en contient plus.
  var CTX_KEY = 'r4p-athlete-ctx';
  if(_patientId || _progId){
    try { localStorage.setItem(CTX_KEY, JSON.stringify({ prog:_progId, patient:_patientId, seance:_seanceId, mode:(params.get('mode')||''), prat:_pratId, nom:nomParam })); } catch(e){}
  } else {
    try {
      var ctx = JSON.parse(localStorage.getItem(CTX_KEY) || 'null');
      if(ctx){
        _progId = ctx.prog||''; _patientId = ctx.patient||''; _seanceId = ctx.seance||'';
        _kineMode = ctx.mode === 'kine'; _pratId = ctx.prat||''; nomParam = ctx.nom||'';
      }
    } catch(e){}
  }

  // Nom du patient (paramètre d'affichage) : l'afficher dans l'en-tête pour que
  // le kiné/l'athlète voie immédiatement à qui correspond le lien.
  var elPat = document.getElementById('headerPatient');
  if(elPat && nomParam) elPat.textContent = nomParam;

  if(_patientId){
    _mode = 'cal';
    document.getElementById('headerSub').textContent = _kineMode ? '🩺 Vue kiné — Calendrier + notes' : 'Calendrier athlète';
    document.getElementById('refreshBtn').onclick = function(){ renderCalendar(); };
    // Sur mobile : vue mois par défaut (cellules compactes avec dots)
    renderCalendar();
  } else if(_progId){
    _mode = 'prog';
    document.getElementById('headerSub').textContent = 'Programme athlète';
    document.getElementById('refreshBtn').onclick = function(){ loadProgById(_progId, renderProgInMain); };
    loadProgById(_progId, renderProgInMain);
  } else {
    showError('Lien invalide', 'Aucun programme ni calendrier spécifié. Demande le lien à ton praticien.');
  }
}

function refresh(){
  if(_mode==='cal') renderCalendar();
  else if(_mode==='prog') loadProgById(_progId, renderProgInMain);
}

// ── Mode programme unique ────────────────────────────
function loadProgById(id, callback){
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳';
  fetch(SUPA_URL + '/rest/v1/programmes?id=eq.' + id + '&select=*', {
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
  })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }); })
  .then(function(res){
    btn.disabled = false; btn.textContent = '↻ Actualiser';
    if(!res.ok){ showError('Erreur '+res.status, JSON.stringify(res.data)); return; }
    var arr = Array.isArray(res.data) ? res.data : [];
    if(!arr.length){ showError('Programme introuvable', 'Ce programme n\'existe plus ou le lien est invalide.'); return; }
    callback(arr[0]);
    document.getElementById('lastUpdated').textContent = 'Actualisé à ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  })
  .catch(function(err){
    btn.disabled = false; btn.textContent = '↻ Actualiser';
    showError('Erreur réseau', err&&err.message||String(err));
  });
}

function renderProgInMain(prog){
  var donnees = prog.donnees || {};
  var isCap = donnees.type === 'cap' || (prog.nom && prog.nom.indexOf('CAP —') === 0);
  var isHsr = donnees.type === 'hsr' || (prog.nom && prog.nom.indexOf('HSR —') === 0);
  var html = isCap ? _buildCapProgHTML(prog) : (isHsr ? _buildHsrProgHTML(prog) : buildProgHTML(prog));
  if(!_seanceId){
    document.getElementById('mainContent').innerHTML = html;
    return;
  }
  fetch(SUPA_URL + '/rest/v1/athlete_feedback?seance_id=eq.' + _seanceId, {
    headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
  })
  .then(function(r){ return r.json(); })
  .then(function(fbArr){
    var existing = (Array.isArray(fbArr) && fbArr.length) ? fbArr[0] : null;
    var raw = prog.donnees || [];
    var blocs = Array.isArray(raw) ? raw : (raw.blocs || []);
    _loadPainRatings();
    _loadSessionNote();
    _initExoEffortsFromFeedback(existing && existing.exo_data);
    html = isCap ? _buildCapProgHTML(prog) : (isHsr ? _buildHsrProgHTML(prog) : buildProgHTML(prog));
    html += (isCap || isHsr) ? _buildCapPainCard(_seanceId, existing) : buildRpeCard(_seanceId, _blocsVisibles(blocs), existing);
    document.getElementById('mainContent').innerHTML = html;
  })
  .catch(function(){
    document.getElementById('mainContent').innerHTML = html;
  });
}

function renderCalendar(){
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳';
  // Protocole actif : chargé à part (dépend du praticien_id), ne bloque pas le reste

        + '&select=id,date,programme_id,programmes(nom),athlete_feedback(rpe,duree_min)&order=date.asc', {
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }),
    fetch(SUPA_URL + '/rest/v1/patient_settings?patient_id=eq.' + _patientId + '&select=cycles', {
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }),
    fetch(SUPA_URL + '/rest/v1/patient_messages?patient_id=eq.' + _patientId + '&order=date.asc', {
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }),
    fetch(SUPA_URL + '/rest/v1/strava_activities?patient_id=eq.' + _patientId
        + '&select=strava_id,date,type,nom,distance_m,duree_s,charge,donnees&order=date.asc', {
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).catch(function(){ return []; })
  ];
  if(_kineMode && _pratId){
    fetches.push(
      fetch(SUPA_URL + '/rest/v1/clinical_notes?patient_id=eq.' + _patientId + '&praticien_id=eq.' + _pratId + '&order=date.asc', {
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }
      }).then(function(r){ return r.json(); }).catch(function(){ return []; })
    );
  }
  Promise.all(fetches)
  .then(function(results){
    btn.disabled = false; btn.textContent = '↻ Actualiser';
    _calEvents   = Array.isArray(results[0]) ? results[0] : [];
    var settingsArr = Array.isArray(results[1]) ? results[1] : [];
    _calCycles   = (settingsArr.length && Array.isArray(settingsArr[0].cycles)) ? settingsArr[0].cycles : [];
    _calMessages = Array.isArray(results[2]) ? results[2] : [];
    _stravaActs  = Array.isArray(results[3]) ? results[3] : [];
    _calClinicalNotes = (results[4] && Array.isArray(results[4])) ? results[4] : [];
    _renderCalGrid();
    document.getElementById('lastUpdated').textContent = 'Actualisé à ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  })
  .catch(function(err){
    btn.disabled = false; btn.textContent = '↻ Actualiser';
    showError('Erreur réseau', err&&err.message||String(err));
  });
}

function setCalView(view){
  _calView = view;
  if(view === 'week'){
    if(_isMobile){
      // Mobile : commence à aujourd'hui (pas forcément lundi)
      var _tnw = new Date(); _tnw.setHours(0,0,0,0);
      _calWeekStart = _tnw;
    } else {
      _calWeekStart = _getMonday(new Date(_calYear, _calMonth, 15));
    }
    _calDayDate   = new Date(_calWeekStart);
  } else if(view === 'day'){
    // Aller au jour du milieu du mois / de la semaine courante
    if(_calView === 'month' || arguments[1] === 'from-month'){
      _calDayDate = new Date(_calYear, _calMonth, new Date().getDate() || 1);
    }
    _calWeekStart = _getMonday(_calDayDate);
    _calYear  = _calDayDate.getFullYear();
    _calMonth = _calDayDate.getMonth();
  } else { // month
    _calYear  = _calWeekStart.getFullYear();
    _calMonth = _calWeekStart.getMonth();
  }
  _renderCalGrid();
}

function goToToday(){
  var now = new Date(); now.setHours(0,0,0,0);
  _calYear      = now.getFullYear();
  _calMonth     = now.getMonth();
  _calWeekStart = _getMonday(now);
  _calDayDate   = new Date(now);
  _renderCalGrid();
}

function jumpToDay(dateStr){
  var d = new Date(dateStr); d.setHours(0,0,0,0);
  _calDayDate   = d;
  _calWeekStart = _getMonday(d);
  _calYear  = d.getFullYear();
  _calMonth = d.getMonth();
  _calView  = 'day';
  _renderCalGrid();
}

function calMove(dir){
  if(_calView === 'day'){
    var dd = new Date(_calDayDate);
    dd.setDate(dd.getDate() + dir);
    _calDayDate   = dd;
    _calWeekStart = _getMonday(dd);
    _calYear  = dd.getFullYear();
    _calMonth = dd.getMonth();
  } else if(_calView === 'week'){
    var ws = new Date(_calWeekStart);
    var step = _isMobile ? 3 : 7;
    ws.setDate(ws.getDate() + dir * step);
    _calWeekStart = ws;
  } else {
    _calMonth += dir;
    if(_calMonth > 11){ _calMonth = 0; _calYear++; }
    if(_calMonth < 0) { _calMonth = 11; _calYear--; }
  }
  _renderCalGrid();
}

/* ── Barre de navigation commune ── */
function _buildCalNav(label){
  return '<div class="cal-nav">'
